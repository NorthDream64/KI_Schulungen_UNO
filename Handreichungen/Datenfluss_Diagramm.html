<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datenfluss-Diagramm</title>
<style>
:root{--bg:#0e1621;--panel:#16222f;--panel2:#1c2b3b;--ink:#e8eef5;--mut:#8fa3b8;--pipe:#22384d;--pipe-edge:#3a566f;--acc:#4cc9f0;--ok:#4ade80;--bad:#c0843f;--warn:#f59e0b;--red:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;border-bottom:1px solid #243649}
header h1{font-size:17px;margin:0;font-weight:650}
header h1 small{color:var(--mut);font-weight:400;margin-left:8px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
button{font:inherit;font-size:13.5px;color:var(--ink);background:var(--panel2);border:1px solid #34506b;border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:#0b5a74;border-color:var(--acc)}
label.sp{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
input[type=range]{width:90px}
main{padding:8px 12px 0}
#wrap{position:relative;width:100%;max-width:1560px;margin:0 auto}
svg#stage{width:100%;height:auto;display:block;background:radial-gradient(ellipse at 50% 40%,#122033,#0b121b);border:1px solid #223447;border-radius:12px;touch-action:manipulation}
.scene{transition:opacity .55s ease,transform .55s ease;transform-origin:800px 330px}
.scene.off{opacity:0;pointer-events:none;transform:scale(1.07)}
#scFab.off{transform:scale(.94)}
.pedge{fill:none;stroke:var(--pipe-edge)}
.pin{fill:none;stroke:var(--pipe)}
.pin.rej{stroke:#33281d}
.pin.ret{stroke:#2a1c20}
.pin.belt{stroke:#232b34}
.pedge.belt{stroke:#3b4756}
.beltl{fill:none;stroke:#566679;stroke-dasharray:2 12;animation:dash 1s linear infinite}
.dl{fill:none;stroke:#d98a8a;stroke-width:2.2;stroke-dasharray:6 9;animation:dash 1.1s linear infinite}
text{pointer-events:none}
.hinttxt{transition:opacity .4s}
@keyframes dash{to{stroke-dashoffset:-14}}
.lbl{fill:var(--ink);font:650 16px system-ui,sans-serif;text-anchor:middle}
.lbl.q{fill:var(--warn)}
.sub{fill:var(--mut);font:13px system-ui,sans-serif;text-anchor:middle}
.tk{fill:var(--ink);font:600 12px system-ui,sans-serif;text-anchor:middle}
.tk2{fill:var(--mut);font:10.5px system-ui,sans-serif;text-anchor:middle}
.tl{text-anchor:start}
.card-bg{fill:#13202e;fill-opacity:.85;stroke:#35506b;stroke-width:1.5}
.card.named .card-bg{stroke:var(--ok)}
.card.ask .card-bg{stroke:var(--warn);stroke-dasharray:6 5;animation:dash 1.4s linear infinite}
.hit{fill:transparent}
.practice .hit.act{cursor:pointer}
.pill{fill:#0f2a3a;stroke:#2f6f8f;cursor:pointer}
.pill:hover{stroke:var(--acc)}
.badge{fill:#0b5a74;stroke:var(--acc)}
.badge-t{fill:#fff;font:700 12px system-ui;text-anchor:middle}
.gear{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
.gear.fast{animation-duration:.9s}
@keyframes spin{to{transform:rotate(360deg)}}
.led{animation:blink 1.4s steps(2) infinite}
.led:nth-child(2n){animation-delay:.5s}
@keyframes blink{50%{opacity:.25}}
.needle{transition:transform 1.2s cubic-bezier(.3,1.6,.5,1)}
.puff{animation:puff .6s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes puff{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.6)}}
.valve{cursor:pointer}
.valve .ring{animation:pulse 1.6s ease-in-out infinite}
.valve.open .ring{animation:none;opacity:0}
@keyframes pulse{50%{opacity:.15}}
.water{fill:#38bdf8;fill-opacity:.1}
.press{animation:press 1.8s ease-in-out infinite}
@keyframes press{0%,100%{transform:translateY(0)}45%,55%{transform:translateY(34px)}}
.scan{animation:scan 1.2s steps(2) infinite}
@keyframes scan{50%{opacity:.2}}
.lens{animation:lens 2.2s ease-in-out infinite}
@keyframes lens{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
.lens2{animation:lens2 2.2s ease-in-out infinite}
@keyframes lens2{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
#bar{display:flex;flex-wrap:wrap;gap:6px 22px;max-width:1560px;margin:8px auto 0;padding:8px 4px;font-size:13px;color:var(--mut)}
#bar b{color:var(--ink);font-variant-numeric:tabular-nums}
#legend{display:flex;flex-wrap:wrap;gap:6px 20px;max-width:1560px;margin:0 auto;padding:0 4px 10px;font-size:12.5px;color:var(--mut);align-items:center}
#legend span{display:inline-flex;gap:6px;align-items:center}
#hint{max-width:1560px;margin:0 auto;padding:0 4px 14px;font-size:13px;color:var(--mut)}
#modal{position:fixed;inset:0;background:rgba(5,10,16,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}
#modal.show{display:flex}
#mbox{background:var(--panel);border:1px solid #3a566f;border-radius:14px;max-width:580px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#mbox h2{margin:0 0 6px;font-size:16px;color:var(--warn)}
#mbox p{margin:0 0 14px;line-height:1.45;font-size:15px}
#opts{display:grid;gap:8px}
#opts button{text-align:left;padding:10px 12px;font-size:14.5px}
#opts button.wrong{border-color:var(--red);background:#3a1717;animation:shake .35s}
#opts button.right{border-color:var(--ok);background:#12351f}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#fb{min-height:22px;margin-top:12px;font-size:14px;line-height:1.45}
#fb.ok{color:var(--ok)}#fb.no{color:#fca5a5}
#mx{margin-top:10px;display:flex;justify-content:space-between;gap:10px}
@media(max-width:700px){header h1 small{display:none}.ctrl{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>Datenfluss-Diagramm <small>Zertifikatskurs KI-Manager:in</small></h1>
  <div class="ctrl">
    <button id="bPractice">Übungsmodus</button>
    <button id="bView">Fabrik aufblättern ⊕</button>
    <button id="bPause">Pause</button>
    <label class="sp">Tempo <input id="rSpeed" type="range" min="0.4" max="2.5" step="0.1" value="1"></label>
    <button id="bAlarm" title="Löst im Betrieb einen Drift-Alarm aus">Drift auslösen</button>
    <button id="bReset">Zurücksetzen</button>
  </div>
</header>
<main>
  <div id="wrap">
    <svg id="stage" viewBox="0 0 1580 760" role="img" aria-label="Animierter Datenfluss von den Datenquellen bis zum Monitoring"></svg>
  </div>
  <div id="bar"></div>
  <div id="legend">
    <span><svg width="16" height="16"><circle cx="8" cy="8" r="4" fill="#38bdf8"/></svg>Datensatz (Farbe = Quelle)</span>
    <span><svg width="22" height="16"><circle cx="8" cy="6" r="4" fill="#38bdf8"/><circle cx="14" cy="10" r="4" fill="#38bdf8"/></svg>Dublette</span>
    <span><svg width="20" height="20"><circle cx="10" cy="10" r="8" fill="#38bdf8" opacity=".85"/></svg>Ausreißer (unplausibel)</span>
    <span><svg width="16" height="16"><circle cx="8" cy="8" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.8"/></svg>unvollständig</span>
    <span><svg width="16" height="16"><rect x="3" y="3" width="10" height="10" fill="#38bdf8"/></svg>falsches Format</span>
    <span><svg width="16" height="16"><circle cx="8" cy="8" r="4" fill="#e0f2fe"/></svg>aufbereitet</span>
    <span><svg width="16" height="16"><circle cx="8" cy="8" r="4" fill="#8a5a2b"/></svg>Quarantäne / verworfen</span>
    <span><svg width="18" height="18"><rect x="4" y="4" width="10" height="10" fill="#fde047" transform="rotate(45 9 9)"/></svg>Modell(kandidat)</span>
    <span><svg width="16" height="16"><circle cx="8" cy="8" r="3.5" fill="#86efac"/></svg>Prognose / Anfrage</span>
  </div>
  <div id="hint"></div>
</main>

<div id="modal" role="dialog" aria-modal="true">
  <div id="mbox">
    <h2 id="mt">Station benennen</h2>
    <p id="mp"></p>
    <div id="opts"></div>
    <div id="fb"></div>
    <div id="mx"><button id="mClose">Schließen</button><button id="mNext" style="display:none">Fluss freigeben ▶</button></div>
  </div>
</div>

<script>
(()=>{
'use strict';
/* ============ Grundlagen ============ */
const svg=document.getElementById('stage');
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const el=(tag,a,parent)=>{const e=document.createElementNS(NS,tag);if(a)for(const k in a)e.setAttribute(k,a[k]);if(parent)parent.appendChild(e);return e;};
const rnd=(a,b)=>a+Math.random()*(b-a);
const COL={clean:'#e0f2fe',bad:'#8a5a2b',model:'#fde047',alarm:'#ef4444',pred:'#86efac'};
const SRC={kasse:'#38bdf8',bestand:'#a78bfa',wetter:'#4ade80',verkehr:'#fb923c',events:'#f472b6'};
const DEF={
  kasse:{dup:.06,miss:.04,fmt:.05,out:.03},
  bestand:{miss:.08,fmt:.10,dup:.04,out:.06},
  wetter:{fmt:.18,miss:.06},
  verkehr:{fmt:.15,miss:.10,dup:.08},
  events:{dup:.15,fmt:.15,miss:.08}
};
const state={practice:false,unlocked:new Set(),paused:false,speed:1,view:'main'};
const locked=k=>state.practice&&!state.unlocked.has(k);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const inc=(sc,k,n=1)=>{sc.st[k]=(sc.st[k]||0)+n;};

function poly(pts,r){
  let d='M'+pts[0][0]+','+pts[0][1];
  for(let i=1;i<pts.length-1;i++){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1),rr=Math.min(r,l1/2,l2/2);
    d+='L'+(x1-(x1-x0)/l1*rr)+','+(y1-(y1-y0)/l1*rr)+'Q'+x1+','+y1+' '+(x1+(x2-x1)/l2*rr)+','+(y1+(y2-y1)/l2*rr);
  }
  const L=pts[pts.length-1];return d+'L'+L[0]+','+L[1];
}

/* ============ Szenen & Rohre ============ */
function mkScene(id){
  const g=el('g',{id,class:'scene'},svg);
  const L={deco:el('g',null,g),edge:el('g',null,g),inn:el('g',null,g),part:el('g',null,g),ui:el('g',null,g)};
  return {id,g,L,pipes:{},parts:[],sources:[],t:0,st:{},labels:[],tanks:{}};
}
function addPipe(sc,o){
  o=Object.assign({r:14},o);
  const d=poly(o.pts,o.r);
  el('path',{d,class:'pedge'+(o.belt?' belt':''),'stroke-width':o.w+5},sc.L.edge);
  const inn=el('path',{d,class:'pin'+(o.cls?' '+o.cls:'')+(o.belt?' belt':''),'stroke-width':o.w},sc.L.inn);
  if(o.dash)el('path',{d,class:'dl'},sc.L.inn);
  if(o.belt)el('path',{d,class:'beltl','stroke-width':o.w-6},sc.L.inn);
  const len=inn.getTotalLength(),n=Math.ceil(len/2)+1;
  o.len=len;o.n=n;o.xs=new Float32Array(n);o.ys=new Float32Array(n);o.nx=new Float32Array(n);o.ny=new Float32Array(n);
  for(let i=0;i<n;i++){
    const s=Math.min(i*2,len),a=inn.getPointAtLength(s),b=inn.getPointAtLength(Math.min(s+1.5,len)),c=inn.getPointAtLength(Math.max(s-1.5,0));
    let tx=b.x-c.x,ty=b.y-c.y;const m=Math.hypot(tx,ty)||1;tx/=m;ty/=m;
    o.xs[i]=a.x;o.ys[i]=a.y;o.nx[i]=-ty;o.ny[i]=tx;
  }
  o._j={};sc.pipes[o.id]=o;return o;
}
function pos(pi,s,off){
  const f=Math.min(Math.max(s/2,0),pi.n-1),i=Math.min(Math.floor(f),pi.n-2),t=f-i;
  return [pi.xs[i]+(pi.xs[i+1]-pi.xs[i])*t+pi.nx[i]*off,pi.ys[i]+(pi.ys[i+1]-pi.ys[i])*t+pi.ny[i]*off];
}
function joinS(a,t){
  if(a._j[t.id]!==undefined)return a._j[t.id];
  const ex=a.xs[a.n-1],ey=a.ys[a.n-1];let best=1e9,bi=0;
  for(let i=0;i<t.n;i++){const d=(t.xs[i]-ex)**2+(t.ys[i]-ey)**2;if(d<best){best=d;bi=i;}}
  return a._j[t.id]=bi*2;
}

/* ============ Partikel ============ */
function shapeOf(p){
  const g=p.el||(p.el=el('g',null,p.sc.L.part));
  while(g.firstChild)g.removeChild(g.firstChild);
  const r=p.r,c=p.col;
  if(p.kind==='model')el('rect',{x:-r*1.1,y:-r*1.1,width:r*2.2,height:r*2.2,fill:COL.model,stroke:'#fff','stroke-width':.8,transform:'rotate(45)'},g);
  else if(p.kind==='alarm'){el('circle',{r:r*1.5,fill:COL.alarm},g);el('circle',{r:r*2.6,fill:'none',stroke:COL.alarm,'stroke-width':1.3,opacity:.6},g);}
  else if(p.kind==='pred')el('circle',{r:r*.85,fill:COL.pred},g);
  else if(p.def==='dup'){el('circle',{cx:-r*.6,cy:-r*.5,r,fill:c},g);el('circle',{cx:r*.6,cy:r*.5,r,fill:c,stroke:'#0b121b','stroke-width':.6},g);}
  else if(p.def==='out')el('circle',{r:r*1.9,fill:c,opacity:.85},g);
  else if(p.def==='miss')el('circle',{r:r*1.05,fill:'none',stroke:c,'stroke-width':1.8},g);
  else if(p.def==='fmt')el('rect',{x:-r*.95,y:-r*.95,width:r*1.9,height:r*1.9,fill:c},g);
  else el('circle',{r,fill:c},g);
}
function mkP(sc,pi,o){
  const p=Object.assign({sc,pipe:pi,s:0,v:rnd(82,104),off:rnd(-.85,.85),jit:rnd(0,40),def:null,kind:'data',col:'#fff',dead:false,r:Math.max(2.4,Math.min(4.6,pi.w*.2))},o);
  shapeOf(p);sc.parts.push(p);return p;
}
function kill(p){p.dead=true;if(p.el&&p.el.parentNode)p.el.parentNode.removeChild(p.el);}
function puff(sc,x,y,col){const c=el('circle',{cx:x,cy:y,r:7,fill:'none',stroke:col||'#fff','stroke-width':1.6,class:'puff'},sc.L.part);setTimeout(()=>c.remove(),650);}
function pickDef(defp){if(!defp)return null;let r=Math.random(),a=0;for(const k in defp){a+=defp[k];if(r<a)return k;}return null;}

function advance(sc,p){
  const pi=p.pipe;let id=null;
  if(pi.sink){pi.sink(p,sc,pi);kill(p);return;}
  if(pi.fork)for(const fid of pi.fork){const f=sc.pipes[fid];mkP(sc,f,{col:p.col,def:p.def,kind:p.kind,r:p.r,off:p.off,s:joinS(pi,f)});}
  if(pi.route)id=pi.to[pi.route(p,sc,pi)];
  else if(pi.nxw){const r=Math.random();let a=0;for(const o of pi.nxw){a+=o.p;if(r<=a){id=o.id;break;}}if(!id)id=pi.nxw[pi.nxw.length-1].id;}
  else id=pi.next;
  const t=sc.pipes[id];if(!t){kill(p);return;}
  p.s=joinS(pi,t);p.pipe=t;
  if(t.enter&&t.enter(p,sc,t)===false)kill(p);
}

function step(sc,dt){
  sc.t+=dt;
  if(sc.tick)sc.tick(sc,dt);
  for(const s of sc.sources){
    const pi=sc.pipes[s.pipe];s.acc=(s.acc||0)+dt*s.rate;
    while(s.acc>=1){s.acc--;
      const col=s.col==='mix'?Object.values(SRC)[Math.floor(Math.random()*5)]:s.col;
      mkP(sc,pi,{col,def:pickDef(s.defp),s:rnd(0,6)});inc(sc,'in');}
  }
  for(const p of sc.parts){
    if(p.dead)continue;
    const pi=p.pipe;let lim=pi.len;
    if(pi.gate&&locked(pi.gate))lim=Math.min(lim,pi.len-5-p.jit);
    let ns=p.s+p.v*dt;
    ns=p.s<=lim?Math.min(ns,lim):p.s;
    p.s=ns;
    if(p.s>=pi.len-.01&&lim>=pi.len){advance(sc,p);if(p.dead)continue;}
    const ex=Math.max(0,pi.w/2-p.r-.8);
    const q=pos(p.pipe,p.s,p.off*ex);
    p.el.setAttribute('transform','translate('+q[0].toFixed(1)+' '+q[1].toFixed(1)+')');
  }
  if(sc.parts.some(p=>p.dead))sc.parts=sc.parts.filter(p=>!p.dead);
}

/* ============ Zeichen-Helfer ============ */
function tank(sc,key,x,y,w,h,title,color){
  const g=el('g',null,sc.L.ui);
  el('rect',{x,y,width:w,height:h,rx:8,fill:'#0f1a26',stroke:color,'stroke-width':1.6},g);
  const fill=el('rect',{x:x+3,y:y+h-3,width:w-6,height:0,rx:5,fill:color,'fill-opacity':.45},g);
  el('text',{x:x+w/2,y:y+h/2-2,class:'tk'},g).textContent=title;
  const c=el('text',{x:x+w/2,y:y+h/2+13,class:'tk2'},g);c.textContent='0';
  const T={n:0,add(){T.n++;const hh=Math.min(h-8,T.n*.5);fill.setAttribute('height',hh);fill.setAttribute('y',y+h-3-hh);c.textContent=T.n+' Datensätze';},
    reset(){T.n=0;fill.setAttribute('height',0);fill.setAttribute('y',y+h-3);c.textContent='0';}};
  sc.tanks[key]=T;return T;
}
function card(sc,key,x,y,w,h,num,short,opt){
  opt=opt||{};
  const g=el('g',{class:'card','data-k':key},sc.L.deco);
  el('rect',{class:'card-bg',x,y,width:w,height:h,rx:12},g);
  const t=el('text',{x:x+w/2,y:y-12,class:'lbl'},sc.L.ui);
  const b=el('g',null,sc.L.ui);
  const bx=opt.badgeIn?x+16:x+w/2,by=opt.badgeIn?y+16:y-40;
  el('circle',{class:'badge',cx:bx,cy:by,r:11},b);
  el('text',{x:bx,y:by+4,class:'badge-t'},b).textContent=num;
  const hit=el('rect',{class:'hit',x:x-6,y:y-52,width:w+12,height:h+52,rx:12},sc.L.ui);
  hit.addEventListener('click',()=>{if(state.practice&&locked(key))openQuiz(key);});
  sc.labels.push({key,t,short,g,hit});
  return g;
}
function trigger(sc,pi,f,label,onFire){
  pi.valve={f};const s=f*pi.len;
  const [x,y]=pos(pi,s,0);
  const g=el('g',{class:'valve'},sc.L.ui);
  const bar=el('rect',{x:x-3.5,y:y-pi.w/2-6,width:7,height:pi.w+12,rx:2,fill:'#ef4444'},g);
  el('line',{x1:x,y1:y-pi.w/2-6,x2:x,y2:y-pi.w/2-20,stroke:'#9fb3c8','stroke-width':3},g);
  el('circle',{class:'ring',cx:x,cy:y-pi.w/2-26,r:15,fill:'none',stroke:'#ef4444','stroke-width':2},g);
  const wheel=el('circle',{cx:x,cy:y-pi.w/2-26,r:10,fill:'#ef4444',stroke:'#fff','stroke-width':1.5},g);
  el('line',{x1:x-7,y1:y-pi.w/2-26,x2:x+7,y2:y-pi.w/2-26,stroke:'#fff','stroke-width':2},g);
  el('text',{x,y:y+pi.w/2+16,class:'tk2'},g).textContent=label;
  el('circle',{cx:x,cy:y-pi.w/2-20,r:24,fill:'transparent'},g);
  let busy=false;
  g.addEventListener('click',()=>{
    if(busy)return;busy=true;g.classList.add('open');
    bar.setAttribute('fill','#4ade80');bar.setAttribute('height',4);bar.setAttribute('y',y-pi.w/2-8);wheel.setAttribute('fill','#4ade80');
    onFire();
    setTimeout(()=>{g.classList.remove('open');bar.setAttribute('fill','#ef4444');bar.setAttribute('height',pi.w+12);bar.setAttribute('y',y-pi.w/2-6);wheel.setAttribute('fill','#ef4444');busy=false;},2200);
  });
}
function refreshLabels(){
  for(const sc of scenes)for(const l of sc.labels){
    const hide=locked(l.key);
    l.t.textContent=hide?'? Station benennen':l.short;
    l.t.setAttribute('class','lbl'+(hide?' q':''));
    l.g.classList.toggle('ask',hide);
    l.g.classList.toggle('named',state.practice&&!hide);
    l.hit.classList.toggle('act',hide);
  }
  if(fab.hints)fab.hints.forEach(h=>h.t.style.opacity=(state.practice&&!state.unlocked.has(h.key))?0:1);
  const m=['st1','raw','st2','st3','st4','st5','st6'].filter(k=>state.unlocked.has(k)).length;
  const d=['ka','kb','kc'].filter(k=>state.unlocked.has(k)).length;
  $('hint').textContent=state.practice

  },
  C:(p,sc,pi)=>{
    if(p.def==='dup'){

      mkP(sc,t,{col:COL.bad,def:null,s:joinS(pi,t),off:p.off});

      const q=pos(pi,p.s,0);puff(sc,q[0],q[1],'#c0843f');

};

    const peak=Math.max(0,1-Math.abs(h-13)/2.5)*.8+Math.max(0,1-Math.abs(h-18)/2);
    sc.kacc=(sc.kacc||0)+dt*(open?3+3*peak:.4);

};

  el('circle',{class:'lens2',cx:1102,cy:290,r:20,fill:'none',stroke:'#7b97ae','stroke-width':3},D);
  el('line',{x1:1000,y1:372,x2:1148,y2:372,stroke:'#4b6f8c','stroke-width':3},D);
  const ex=[['ka',['Riesige Werte und hohle Ringe','werden aussortiert (Quarantäne).'],365],['kb',['Eckiges wird rund:','ein einheitliches Format.'],735],['kc',['Zwei Kreise werden zu einem –','die Kopie fällt heraus.'],1050]];
  ex.forEach(e=>{const t=el('text',{x:e[2],y:474,class:'sub hinttxt'},U);
    e[1].forEach((ln,i)=>el('tspan',{x:e[2],dy:i?16:0},t).textContent=ln);
    fab.hints.push({key:e[0],t});});
  el('text',{x:90,y:296,class:'sub'},U).textContent='Rohdaten (Kopie)';
  el('text',{x:1400,y:296,class:'sub'},U).textContent='aufbereitet → zum Modell';
  tank(fab,'ta',390,610,160,84,'Quarantäne','#c0843f');
  tank(fab,'tc',1080,610,160,84,'Dubletten (verworfen)','#c0843f');
  const b=el('g',{style:'cursor:pointer'},U);
  el('rect',{x:30,y:60,width:160,height:30,rx:15,class:'pill'},b);
  el('text',{x:110,y:80,class:'tk'},b).textContent='← zur Hauptansicht';
  b.addEventListener('click',()=>setView('main'));
})();

const scenes=[main,fab];

/* ============ Quiz ============ */
const N={st1:'Datenquellen & Datenerfassung',raw:'Rohdatenspeicher (Raw Layer)',st2:'Datenaufbereitung (Cleaning & Standardisierung)',st3:'Modellierung (Training)',st4:'Modellvalidierung',st5:'Deployment (Bereitstellung)',st6:'Monitoring & Drift-Erkennung'};
const QUIZ={
 st1:{p:'Beobachte: Kassendaten fließen laufend, Bestandsmeldungen kommen gebündelt zweimal am Tag, Partnerdaten nur auf Knopfdruck – und jede Meldung wird auf dem Weg gespiegelt. Wie heißt diese Station?',c:N.st1,w:[N.st3,'Anforderungsanalyse','Lastverteilung','Penetrationstest'],why:'Am Anfang jeder KI-Lieferkette steht die Herkunft der Daten. Die Quellen unterscheiden sich in Takt (laufend, zweimal täglich, auf Abruf), Menge und Zuverlässigkeit – und jede bringt eigene Qualitätsrisiken mit.'},
 raw:{p:'Beobachte: Alles, was eingeht, wird unverändert kopiert und abgelegt. Der Bestand wächst nur, gelesen wird eine Kopie. Wie heißt dieser Speicher?',c:N.raw,w:['Data Mart (Auswertungsschicht)','Operatives Kassensystem','Modellregister','Lastverteilung'],why:'Die Rohdatenschicht hält die Originale: AWS empfiehlt dafür das Originalformat und aktivierte Versionierung. Bereinigt wird erst danach in einer eigenen Stufe. So bleiben die Betriebssysteme unberührt, und bei einem Fehler in der Aufbereitung lässt sich neu rechnen.'},
 st2:{p:'Beobachte: Eine Fabrik prüft, vereinheitlicht und gleicht ab – Ausschuss und Kopien fallen heraus, der Rest läuft einheitlich weiter. Wie heißt diese Station?',c:N.st2,w:[N.st4,'Lieferantenaudit','Datenverschlüsselung',N.st5],why:'Rohdaten sind selten modelltauglich. Hier werden Fehlerhaftes aussortiert, Formate vereinheitlicht und Dubletten entfernt. Bei AWS entspricht das der Stage-Schicht (Validierung, Format-Konvertierung, Transformation), im ELT-Muster von Google dem Transform-Schritt nach dem Laden.'},
 st3:{p:'Beobachte: Aus dem sauberen Datenstrom entstehen nur wenige goldene Modellkandidaten – der Rest verschwindet im Zahnrad. Wie heißt diese Station?',c:N.st3,w:[N.st2,'Lastverteilung','Anforderungsanalyse',N.st6],why:'Im Training lernt das Modell Muster aus den Daten. Die Daten selbst bleiben nicht erhalten – es entsteht ein Modellartefakt, das später Vorhersagen liefert.'},
 st4:{p:'Beobachte: Nur ein Teil der Modelle passiert die Prüfschranke, die übrigen laufen zurück ins Training. Wie heißt diese Station?',c:N.st4,w:[N.st3,N.st5,N.st1,'Lieferantenaudit'],why:'Vor dem Einsatz wird das Modell auf ungesehenen Testdaten geprüft. Genauigkeit allein kann täuschen; die Abwägung zwischen falsch-positiv und falsch-negativ sowie der Schwellenwert sind Geschäftsentscheidungen.'},
 st5:{p:'Beobachte: Ein freigegebenes Modell bedient plötzlich viele Anfragen – grüne Prognosen strömen heraus. Wie heißt diese Station?',c:N.st5,w:[N.st4,N.st2,N.st6,'Penetrationstest'],why:'Beim Deployment geht das freigegebene Modell in den Betrieb und beantwortet laufend Anfragen. Es ist der Anfang des Modell-Lebens im Betrieb, nicht sein Ende.'},
 st6:{p:'Beobachte: Ein Drift-Alarm läuft über die gestrichelte Leitung zurück und startet das Nachtraining. Wie heißt diese Station?',c:N.st6,w:[N.st3,N.st5,N.st1,'Datenverschlüsselung'],why:'Im Betrieb entfernt sich die Realität von den Trainingsdaten – Drift ist der Normalfall. Monitoring erkennt das und stößt Nachtraining an (Continuous Training).'},
 ka:{p:'Beobachte: Riesige Werte und hohle Ringe werden vom Portal erfasst und fallen aus der Linie. Wie heißt dieser Schritt?',c:'Eingangsprüfung: Fehlerhaftes aussortieren',w:['Formate standardisieren','Dubletten entfernen','Datenverschlüsselung','Lastverteilung'],why:'Unplausible (z. B. negativer Bestand) oder unvollständige Datensätze werden aussortiert – besser in Quarantäne abgelegt als stillschweigend gelöscht, damit sich die Ursache an der Quelle beheben lässt. Kein Filter ist perfekt: einzelne Fehler rutschen durch.'},
 kb:{p:'Beobachte: Eckige Elemente werden unter der Presse rund – alles hat danach dasselbe Format. Wie heißt dieser Schritt?',c:'Standardisierung: Formate vereinheitlichen',w:['Fehlerhaftes aussortieren','Dubletten entfernen','Hyperparameter festlegen','Penetrationstest'],why:'Einheitliche Formate, Einheiten und Schreibweisen (z. B. °C statt °F, ein Datumsformat). Die Format-Konvertierung nennt AWS als Aufgabe der Stage-Schicht. Sie gehört zur Transformation – in der Praxis laufen Bereinigen und Standardisieren meist in derselben Stufe.'},
 kc:{p:'Beobachte: Aus zwei Kreisen wird einer – die Kopie fällt heraus. Wie heißt dieser Schritt?',c:'Deduplizierung: Dubletten entfernen',w:['Standardisierung: Formate vereinheitlichen','Modelltraining','Drift-Erkennung','Lastverteilung'],why:'Mehrfach gemeldete Datensätze (z. B. doppelt gebuchte Bons oder mehrfach gemeldete Veranstaltungen) werden auf einen reduziert. Das gelingt zuverlässiger nach der Standardisierung, weil gleiche Dinge dann auch gleich geschrieben sind.'}
};
function openQuiz(k){
  const q=QUIZ[k];
  $('mt').textContent='Station benennen';$('mp').textContent=q.p;$('fb').textContent='';$('fb').className='';
  $('mNext').style.display='none';
  const box=$('opts');box.innerHTML='';
  shuffle([q.c].concat(q.w)).forEach(t=>{
    const b=document.createElement('button');b.textContent=t;
    b.addEventListener('click',()=>{
      if(b.classList.contains('right'))return;
      if(t===q.c){
        b.classList.add('right');box.querySelectorAll('button').forEach(x=>x.disabled=true);
        $('fb').className='ok';$('fb').textContent='Richtig. '+q.why;
        $('mNext').style.display='';state.unlocked.add(k);refreshLabels();
      }else{
        b.classList.add('wrong');$('fb').className='no';$('fb').textContent='Das passt nicht zu dem, was Du gerade im Fluss siehst. Schau noch einmal hin.';
        setTimeout(()=>b.classList.remove('wrong'),400);
      }
    });
    box.appendChild(b);
  });
  $('modal').classList.add('show');
}
const closeQ=()=>$('modal').classList.remove('show');
$('mClose').onclick=closeQ;$('mNext').onclick=closeQ;
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeQ();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQ();});

/* ============ Steuerung ============ */
function setView(v){
  state.view=v;
  main.g.classList.toggle('off',v!=='main');fab.g.classList.toggle('off',v!=='fab');
  $('bView').textContent=v==='main'?'Fabrik aufblättern ⊕':'← Hauptansicht';
}
$('bView').onclick=()=>setView(state.view==='main'?'fab':'main');
$('bPause').onclick=()=>{state.paused=!state.paused;$('bPause').textContent=state.paused?'Weiter':'Pause';$('bPause').classList.toggle('on',state.paused);};
$('rSpeed').oninput=e=>state.speed=+e.target.value;
function clearAll(){
  for(const sc of scenes){
    sc.parts.forEach(kill);sc.parts=[];sc.sources.forEach(s=>s.acc=0);
    for(const k in sc.st)sc.st[k]=0;
    for(const k in sc.tanks)sc.tanks[k].reset();
  }
  raw.q=[];raw.total=0;raw.read=0;raw.acc=0;raw.ops=[0,0];opsText[0].textContent='0';opsText[1].textContent='0';rawUpdate();
  main.hour=7;main.bq=0;main.kacc=0;PART.forEach(p=>{p.q=0;p.acc=0;});
}
$('bPractice').onclick=()=>{
  state.practice=!state.practice;$('bPractice').classList.toggle('on',state.practice);
  document.body.classList.toggle('practice',state.practice);
  state.unlocked.clear();clearAll();
  $('bPractice').textContent=state.practice?'Übungsmodus: AN':'Übungsmodus';
  refreshLabels();
};
$('bReset').onclick=()=>{clearAll();if(state.practice)state.unlocked.clear();refreshLabels();};
function triggerAlarm(){
  if(state.practice&&locked('st6'))return;
  mkP(main,main.pipes.retrain,{kind:'alarm',col:COL.alarm,r:3.4,off:0,v:70,s:0});
  const n=$('needle');n.style.transform='rotate(55deg)';
  setTimeout(()=>{n.style.transform='rotate(-45deg)';},5200);
}
$('bAlarm').onclick=triggerAlarm;
function retrainFx(){
  main.st.retrain++;
  const g=$('gearG'),t=$('retrTxt');g.classList.add('fast');t.setAttribute('opacity',1);
  setTimeout(()=>{g.classList.remove('fast');t.setAttribute('opacity',0);},4000);
}

/* ============ Hauptschleife ============ */
let last=performance.now(),alarmT=0,barT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!state.paused){
    const d=dt*state.speed;
    step(state.view==='main'?main:fab,d);
    if(state.view==='main'){alarmT+=d;if(alarmT>32&&main.st.pred>12){alarmT=0;triggerAlarm();}}
  }
  barT+=dt;if(barT>.3){barT=0;updateBar();}
  requestAnimationFrame(frame);
}
function updateBar(){
  const s=main.st,k=fab.st;
  $('bar').innerHTML=state.view==='main'
   ?'<span>Eingespeist: <b>'+s.in+'</b></span><span>Rohdatenspeicher: <b>'+raw.total+'</b> (Rückstand '+raw.q.length+')</span><span>Quarantäne: <b>'+s.rej+'</b> · Dubletten: <b>'+s.dups+'</b></span><span>Modellkandidaten: <b>'+s.models+'</b></span><span>validiert: <b style="color:#4ade80">'+s.ok+'</b> · zurück ins Training: <b style="color:#f59e0b">'+s.back+'</b></span><span>Prognosen: <b>'+s.pred+'</b></span><span>Nachtrainings: <b>'+s.retrain+'</b></span>'
   :'<span>Eingang: <b>'+k.in+'</b></span><span>Quarantäne: <b>'+k.rej+'</b></span><span>Formate vereinheitlicht: <b>'+k.fix+'</b></span><span>Dubletten entfernt: <b>'+k.dups+'</b></span><span>aufbereitet weitergeleitet: <b>'+k.clean+'</b> (davon mit Restfehler: <b style="color:#f59e0b">'+(k.rest||0)+'</b>)</span>';
}
refreshLabels();updateBar();requestAnimationFrame(frame);
window.__dfl={main,fab,state,step,raw};
})();
</script>
