<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernkontrolle · KI-Manager Tag 4 · Projektinitiierung &amp; Stakeholder-Management</title>
<style>
:root {
  --ink:#1a1a18;--paper:#f5f2ec;--card:#fff;--rule:#d5d0c5;--muted:#888880;
  --accent:#5a3a7a;--accent-soft:#f0eaf7;
  --role-a:#1a6a5a;--role-a-soft:#e6f4f1;
  --role-b:#5a3a7a;--role-b-soft:#f0eaf7;
  --correct:#2a7a50;--correct-bg:#eaf5ee;--correct-border:#a0d8b8;
  --wrong:#9a2a2a;--wrong-bg:#faeaea;--wrong-border:#d8a0a0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;font-size:15px;}
a{color:var(--accent);}
.site-header{border-bottom:2px solid var(--ink);padding:1.8rem 2rem 1.4rem;max-width:820px;margin:0 auto;}
.eyebrow{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;}
.site-header h1{font-family:Georgia, "Times New Roman", serif;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.15;margin-bottom:.4rem;}
.header-meta{font-size:12px;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap;}
.header-meta span::before{content:"· ";}
.header-meta span:first-child::before{content:"";}
.main{max-width:820px;margin:0 auto;padding:1.8rem 2rem 4rem;}
.setup-card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:2rem;max-width:540px;margin:0 auto;}
.setup-card h2{font-family:Georgia, "Times New Roman", serif;font-size:1.3rem;margin-bottom:1.2rem;}
.field-label{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.35rem;}
.setup-input{width:100%;border:1px solid var(--rule);border-radius:8px;padding:.6rem .9rem;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:14px;background:var(--paper);outline:none;color:var(--ink);transition:border-color .15s;}
.setup-input:focus{border-color:var(--ink);}
.role-btns{display:flex;gap:.5rem;}
.sel-btn{flex:1;padding:.55rem .6rem;border:1px solid var(--rule);border-radius:8px;background:none;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:13px;cursor:pointer;text-align:center;transition:all .15s;color:var(--ink);}
.sel-btn.active-a{background:var(--role-a-soft);border-color:var(--role-a);color:var(--role-a);font-weight:500;}
.sel-btn.active-b{background:var(--role-b-soft);border-color:var(--role-b);color:var(--role-b);font-weight:500;}
.hint-text{font-size:12px;color:var(--muted);margin-top:.3rem;display:block;}
.btn-start{width:100%;padding:.75rem;background:var(--ink);color:#fff;border:none;border-radius:8px;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:1rem;transition:background .15s;}
.btn-start:hover{background:#333;}
.btn-start:disabled{background:#aaa;cursor:not-allowed;}
.quiz-header-strip{display:flex;gap:.6rem;align-items:center;margin-bottom:1.4rem;flex-wrap:wrap;}
.strip-tag{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px;border-radius:100px;}
.strip-role-a{background:var(--role-a-soft);color:var(--role-a);}
.strip-role-b{background:var(--role-b-soft);color:var(--role-b);}
.strip-name{font-size:13px;color:var(--muted);margin-left:auto;}
.progress-bar{height:3px;background:var(--rule);border-radius:2px;margin-bottom:1.2rem;}
.progress-fill{height:100%;background:var(--ink);border-radius:2px;transition:width .3s;}
.progress-label{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:10px;color:var(--muted);margin-bottom:.5rem;}
.q-sc{font-size:13px;color:#555;font-style:italic;border-left:3px solid var(--accent);padding:.4rem .8rem;margin-bottom:.5rem;background:var(--accent-soft);border-radius:0 6px 6px 0;}
.q-card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:1.5rem;margin-bottom:1rem;}
.q-num{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;}
.q-text{font-size:15px;font-weight:500;line-height:1.55;margin-bottom:.5rem;}
.opt-list{display:flex;flex-direction:column;gap:.5rem;}
.opt{display:flex;align-items:flex-start;gap:.7rem;padding:.75rem 1rem;border:1px solid var(--rule);border-radius:8px;cursor:pointer;background:#fdfdfb;transition:all .12s;-webkit-user-select:none;user-select:none;}
.opt:hover:not(.disabled){border-color:#888;background:#f5f2ec;}
.opt.selected{background:var(--accent-soft);border-color:#b8a0d8;}
.opt.disabled{cursor:default;}
.opt.correct-sel{background:var(--correct-bg);border-color:var(--correct-border);}
.opt.wrong-sel{background:var(--wrong-bg);border-color:var(--wrong-border);}
.opt.missed{background:var(--wrong-bg);border-color:var(--wrong-border);}
.opt-cb{width:18px;height:18px;min-width:18px;border:1.5px solid #bbb;border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.opt-cb.chk{background:var(--ink);border-color:var(--ink);}
.opt-cb.chk::after{content:'';display:block;width:8px;height:8px;background:#fff;border-radius:2px;}
.opt.correct-sel .opt-cb{background:var(--correct);border-color:var(--correct);}
.opt.correct-sel .opt-cb::after{content:'\2713';color:#fff;font-size:11px;background:none;width:auto;height:auto;}
.opt.wrong-sel .opt-cb{background:var(--wrong);border-color:var(--wrong);}
.opt.wrong-sel .opt-cb::after{content:'\2717';color:#fff;font-size:11px;background:none;width:auto;height:auto;}
.opt.missed .opt-cb{background:var(--wrong);border-color:var(--wrong);}
.opt.missed .opt-cb::after{content:'\2192';color:#fff;font-size:11px;background:none;width:auto;height:auto;}
.opt-letter{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:12px;color:var(--muted);min-width:16px;flex-shrink:0;margin-top:2px;}
.opt-text{font-size:14px;line-height:1.5;}
.feedback{border-radius:8px;padding:.9rem 1.1rem;margin-top:.9rem;}
.feedback.fb-ok{background:var(--correct-bg);border:1px solid var(--correct-border);}
.feedback.fb-wrong{background:var(--wrong-bg);border:1px solid var(--wrong-border);}
.fb-title{font-weight:500;font-size:14px;margin-bottom:.4rem;}
.fb-ok .fb-title{color:var(--correct);}
.fb-wrong .fb-title{color:var(--wrong);}
.fb-text{font-size:13px;line-height:1.65;color:#444;margin-bottom:.5rem;}
.fb-source{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:.5rem;}
.nav-row{display:flex;align-items:center;gap:.6rem;margin-top:1rem;}
.btn{display:inline-flex;align-items:center;padding:.55rem 1.2rem;border:1px solid var(--rule);border-radius:8px;background:none;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink);transition:all .15s;}
.btn:hover{background:var(--paper);border-color:#888;}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.btn-full{width:100%;justify-content:center;padding:.7rem;font-size:15px;margin-top:1rem;}
.btn-submit{background:#1a6a5a;color:#fff;border-color:#1a6a5a;}
.btn-submit:hover{background:#145548;}
.result-block{max-width:600px;margin:0 auto;text-align:center;}
.result-grade{font-family:Georgia, "Times New Roman", serif;font-size:4.5rem;line-height:1;margin-bottom:.3rem;}
.result-label{font-size:1.1rem;font-weight:500;margin-bottom:.3rem;}
.result-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem;}
.stats-row{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:.9rem 1.2rem;text-align:center;min-width:90px;}
.stat-n{font-size:1.8rem;font-weight:500;}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px;}
.comp-title{font-size:13px;font-weight:500;text-align:left;margin-bottom:.8rem;}
.comp-row{margin-bottom:.7rem;text-align:left;}
.comp-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px;}
.comp-track{height:4px;background:var(--rule);border-radius:2px;}
.comp-fill{height:100%;border-radius:2px;}
.fill-ok{background:var(--correct);}
.fill-wrong{background:var(--wrong);}
.submit-status.sending{background:#fff8e8;color:#7a5a00;border:1px solid #e8d090;}
.submit-status.success{background:#eaf5ee;color:#2a7a50;border:1px solid #a0d8b8;}
</style>
</head>
<body>

<header class="site-header">
  <div class="eyebrow">Alfatraining &middot; KI-Manager:in &middot; Tag 4</div>
  <h1>Lernkontrolle<br>Projektinitiierung &amp; Stakeholder-Management</h1>
  <div class="header-meta">
    <span>5 Fragen je Rolle</span>
    <span>Eine oder mehrere Antworten k&ouml;nnen richtig sein</span>
  </div>
</header>

<main class="main">

<div id="setup-section">
  <div class="setup-card">
    <h2>Bitte w&auml;hle deine Rolle</h2>
    <div style="margin-bottom:1.2rem;">
      <span class="field-label">Dein Name (oder Teilnehmer-Nummer)</span>
      <input type="text" id="participant-name" class="setup-input" placeholder="z. B. Teilnehmer-07 oder Vorname">
    </div>
    <div style="margin-bottom:1rem;">
      <span class="field-label">Rolle</span>
      <div class="role-btns">
        <button class="sel-btn" id="btn-role-a" onclick="selectRole('a')">KI-Manager:in</button>
        <button class="sel-btn" id="btn-role-b" onclick="selectRole('b')">Fachbereichsleitung</button>
      </div>
      <span class="hint-text">W&auml;hle deine Rolle im Unternehmen</span>
    </div>
    <button class="btn-start" id="btn-start" onclick="startQuiz()" disabled>Quiz starten &rarr;</button>
  </div>
</div>

<div id="quiz-section" style="display:none">
  <div class="quiz-header-strip" id="quiz-header-strip"></div>
  <div class="progress-label" id="progress-label"></div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div id="questions-container"></div>
  <div class="nav-row" style="margin-top:1.5rem">
    <button class="btn btn-submit btn-full" id="btn-submit" onclick="submitQuiz()" disabled>Auswertung anzeigen &rarr;</button>
  </div>
</div>

<div id="results-section" style="display:none">
  <div id="submit-status" class="submit-status" style="display:none;max-width:600px;margin:1rem auto;text-align:center;padding:.6rem 1rem;border-radius:8px;font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;font-size:12px;"></div>
  <div class="result-block">
    <div class="result-grade" id="result-grade"></div>
    <div class="result-label" id="result-label"></div>
    <div class="result-sub" id="result-sub"></div>
    <div class="stats-row" id="stats-row"></div>
    <div class="comp-title">Kompetenzprofil</div>
    <div id="comp-bars"></div>
    <div style="margin-top:.8rem;display:flex;justify-content:center;">
      <button class="btn" onclick="location.reload()">Neu starten</button>
    </div>
  </div>
  <hr style="border:none;border-top:1px solid var(--rule);margin:2rem 0">
  <h2 style="font-family:Georgia, 'Times New Roman', serif;font-size:1.2rem;margin-bottom:1rem">Detailauswertung</h2>
  <div id="review-container"></div>
</div>

</main>

<script>
/* ═══ FRAGEN ══════════════════════════════════════════════════ */

var QBANK = {

/* ─── KI-Manager:in · 2r,1r,3r,3r,3r ─── */
a: [
  {
    sc: 'Im Kick-off-Meeting legt die KI-Managerin gemeinsam mit dem Team den Scope für den Piloten fest.',
    q: 'Welche Aussage(n) zur Scope-Abgrenzung eines KI-Pilotprojekts ist oder sind korrekt?',
    opts: [
      'Die finale Entscheidung (z. B. Kreditvergabe, Leistungsbeurteilung) muss Out-of-Scope bleiben — sie verbleibt beim Menschen (EU AI Act Art. 14)',
      'Die Scope-Abgrenzung muss vom Auftraggeber schriftlich freigegeben werden',
      'Out-of-Scope-Punkte können mündlich vereinbart werden, wenn das Vertrauensverhältnis stimmt',
      'Die Integration in das Legacy-Kernsystem sollte In-Scope sein, um den Nutzen zu maximieren'
    ],
    correct: [0,1],
    exp: 'Die finale Entscheidung muss beim Menschen bleiben (Human Oversight, EU AI Act Art. 14) und ist daher Out-of-Scope. Schriftliche Freigabe ist Pflicht — mündliche Absprachen zählen nicht. Legacy-Integration ist sinnvoll als Phase 2, aber nicht im Pilotscope.',
    src: 'PMI PMBOK® Guide, 7. Aufl. (Scope Management) · pmi.org/pmbok-guide-standards'
  },
  {
    sc: 'Die KI-Managerin formuliert Projektziele für den Piloten und erklärt dem Team das SMART-Prinzip.',
    q: 'Welche Aussage(n) unterscheidet ein SMART-Ziel von einem allgemeinen Projektziel ist oder sind korrekt?',
    opts: [
      'Ein SMART-Ziel muss spezifisch, messbar, erreichbar, relevant und termingebunden sein — ohne alle fünf Kriterien ist es kein vertretbares Projektmandat',
      'SMART-Ziele sind nur für IT-Projekte relevant — KI-Projekte nutzen OKRs (Objectives and Key Results)',
      'Ein allgemeines Projektziel reicht aus, wenn das Budget bereits genehmigt ist',
      'SMART-Ziele werden erst nach dem Pilotbetrieb formuliert, da vorher zu viel Unsicherheit besteht'
    ],
    correct: [0],
    exp: 'Alle fünf SMART-Kriterien müssen erfüllt sein: Specific (was genau?), Measurable (welcher KPI?), Achievable (realistisch?), Relevant (strategische Priorität?), Time-bound (bis wann?). Ohne SMART-Ziel kein vertretbares Projektmandat und kein Budget-Commitment.',
    src: 'PMI PMBOK® Guide, 7. Aufl. · pmi.org/pmbok-guide-standards · Doran (1981) – S.M.A.R.T. Goals · Management Review, Vol. 70 Nr. 11'
  },
  {
    sc: 'Die KI-Managerin kartiert die Stakeholder mit der Mendelow-Matrix und leitet Einbindungsstrategien ab.',
    q: 'Welche Aussage(n) zur Mendelow-Matrix im KI-Pilotprojekt ist oder sind korrekt?',
    opts: [
      'Die Geschäftsführung gehört in Q1 (hohe Macht, hohes Interesse) — sie hat das Mandat erteilt und hat strategisches Interesse am Projekterfolg',
      'Die fachlich betroffene Abteilungsleitung gehört in Q1 (hohe Macht, hohes Interesse) — sie muss aktiv gemanagt werden',
      'Der Betriebsrat gehört in Q1 (hohe Macht, hohes Interesse) — sein Mitbestimmungsrecht nach § 87 BetrVG macht ihn zum Schlüssel-Stakeholder',
      'Q2-Stakeholder (hohe Macht, niedriges Interesse) sollten ignoriert werden, um Ressourcen zu sparen'
    ],
    correct: [0,1,2],
    exp: 'Die Geschäftsführung ist Q1 — sie hat das Mandat erteilt und hat hohes Interesse am Projekterfolg (strategische Initiative). Die Fachbereichsleitung ist ebenfalls Q1. Der Betriebsrat ist Q1. Q2-Stakeholder werden zufriedengestellt (Meilenstein-Updates), nicht ignoriert.',
    src: 'PMI PMBOK® Guide (Stakeholder Management) · pmi.org/pmbok-guide-standards · HBR – Stakeholder Management · hbr.org/topic/subject/stakeholder-management'
  },
  {
    sc: 'Einige Mitarbeitende der betroffenen Fachabteilung zeigen offenen Widerstand gegen das KI-Pilotprojekt.',
    q: 'Welche Aussage(n) zu Maßnahmen im Umgang mit Widerstand bei der Einführung eines KI-Systems ist oder sind korrekt?',
    opts: [
      'Die Change Story klar kommunizieren: Das System unterstützt die Fachabteilung — die finale Entscheidung verbleibt beim Menschen',

    correct: [0,2,3],
    exp: 'Drei Kernmaßnahmen: Change Story (was ändert sich, was bleibt) ✓, Human-in-the-Loop sichtbar machen ✓, persönlicher Nutzen kommunizieren ✓. Mitarbeitende NICHT erst nach Go-Live informieren — das erzeugt Misstrauen und passiven Widerstand.',
    src: 'Kotter & Schlesinger (2008) – Choosing Strategies for Change · hbr.org/2008/07/choosing-strategies-for-change · HBR – Change Management · hbr.org/topic/subject/change-management'

  {

    exp: 'SMART-Ziele, Scope und RACI sind Pflicht. Risiken mit Mitigation zeigen Professionalität und schützen die KI-Manager:in. Meilensteine mit Go/No-Go-Gates sichern Steuerbarkeit. Ohne Unterschrift des Auftraggebers ist die Charta nicht bindend — Budget muss schriftlich bestätigt sein.',

/* ─── Fachbereichsleitung · 3r,2r,1r,3r,2r ─── */
b: [
  {
    sc: 'Als Fachbereichsleitung erfährst du in einer Abteilungsleitersitzung von der geplanten KI-Einführung in deinem Bereich.',

  {

      'EU AI Act Art. 14 (Human Oversight) schreibt für Hochrisiko-KI vor, dass Menschen in die Lage versetzt werden müssen, KI-Entscheidungen zu überprüfen und zu überstimmen',
      'Die finale Entscheidung ist Out-of-Scope für den Piloten — sie verbleibt ausdrücklich beim Mitarbeitenden',

      'Das Überstimmungsrecht muss in jedem Fall in einer Betriebsvereinbarung schriftlich festgehalten werden'
    ],
    correct: [0,1],
    exp: 'EU AI Act Art. 14 sichert Human Oversight rechtlich. Die Projektcharta legt die finale Entscheidung explizit Out-of-Scope. Theoretisches Eingriffsrecht reicht nicht — das System muss so gestaltet sein, dass ein Mensch tatsächlich eingreifen KANN. Eine Betriebsvereinbarung ist empfehlenswert, aber nicht zwingend Tier-1-Pflicht.',
    src: 'EU AI Act Art. 14 (menschliche Aufsicht über Hochrisiko-KI) · eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202401689 · BaFin MaRisk AT 7.2 · bafin.de'
  },
  {
    sc: 'Du hörst zum ersten Mal von der geplanten KI-Lösung für deine Abteilung und überlegst, wie du reagieren sollst.',
    q: 'Welche Aussage(n) zu deiner ersten Reaktion als Fachbereichsleitung ist oder sind korrekt?',
    opts: [
      'Sofortige Ablehnung — ohne Betriebsrat und Datenschutzbeauftragten darf das Projekt nicht gestartet werden',
      'Konstruktive Gesprächsanfrage an die KI-Manager:in: Du möchtest verstehen, was das konkret für deinen Bereich bedeutet',
      'Dem Betriebsrat informell berichten — als Frühwarnsignal für die Belegschaft',
      'Abwarten, bis das Projekt konkreter ist — frühe Einbindung kostet Zeit ohne Nutzen'
    ],
    correct: [1],
    exp: 'Konstruktiver Dialog mit der KI-Manager:in ist die richtige erste Reaktion: Verstehen, was geplant ist, Bedenken einbringen und Expertise einbringen. Sofortige Ablehnung verhindert Einfluss. Dem Betriebsrat informell berichten ist riskant — das erzeugt unkontrollierte Kommunikationskanäle. Frühzeitige Einbindung schützt deine Interessen.',
    src: 'PMI PMBOK® Guide (Stakeholder Engagement) · pmi.org/pmbok-guide-standards · HBR – Change Management · hbr.org/topic/subject/change-management'

    opts: [
      'Gespräch suchen: Was stört ihn? Technisches Problem, Vertrauensmangel oder ungelöster rationaler Einwand?',
      'Den Mitarbeitenden abmahnen, da er das System boykottiert und damit die Prozesseffizienz sabotiert',

    ],
    correct: [0,2],
    exp: 'Gespräch suchen ist die erste Reaktion: Was liegt dahinter? Technisches Problem, fehlende Schulung oder legitime Einwände? Die KI-Manager:in informieren: Systematische Überstimmung kann Modell-Drift oder Bias-Problem signalisieren. Abmahnen bei Override-Ausübung ist rechtlich problematisch. Override ist legitim — aber ein systematisches Muster verdient Aufmerksamkeit.',
    src: 'EU AI Act Art. 26 Abs. 5 (Betreiberpflichten nach Inbetriebnahme) · eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202401689 · PMI PMBOK® Guide · pmi.org/pmbok-guide-standards'

};
/* Ende QBANK */

var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPs358GF_E1xsvTh08PpTpZcBDS1OvsU9XQ0qi0MkZoCCnAk4dyo3Aii0OYxILdvCRYA/exec';
var selectedRole = null, questions = [], userAnswers = [];
var participantName = '';

function selectRole(r) {
  selectedRole = r;
  document.getElementById('btn-role-a').className = 'sel-btn' + (r==='a' ? ' active-a' : '');
  document.getElementById('btn-role-b').className = 'sel-btn' + (r==='b' ? ' active-b' : '');
  checkReady();
}
function checkReady() {
  document.getElementById('btn-start').disabled = !selectedRole;
}

function shuffle(arr) {
  var a = arr.slice(), i = a.length, j, t;
  while (i--) { j = Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function startQuiz() {
  var pool = QBANK[selectedRole] || [];
  questions = pool.map(function(q) {
    var indices = q.opts.map(function(_,i){return i;});
    var shuffled = shuffle(indices);
    var newOpts = shuffled.map(function(i){return q.opts[i];});
    var newCorrect = q.correct.map(function(c){return shuffled.indexOf(c);});
    return {q: q.q, sc: q.sc||'', opts: newOpts, correct: newCorrect, exp: q.exp, src: q.src||''};
  });
  userAnswers = questions.map(function(){return [];});

  document.getElementById('setup-section').style.display = 'none';
  document.getElementById('quiz-section').style.display = 'block';

  var roleLabels = {a:'KI-Manager:in', b:'Fachbereichsleitung'};
  var name = document.getElementById('participant-name').value.trim() || 'Anonym';
  participantName = name;
  var strip = document.getElementById('quiz-header-strip');
  strip.innerHTML =
    '<span class="strip-tag strip-role-' + selectedRole + '">' + roleLabels[selectedRole] + '</span>' +
    '<span class="strip-name">' + name + '</span>';

  renderQuestions();
  updateProgress();
}

function renderQuestions() {
  var container = document.getElementById('questions-container');
  container.innerHTML = '';
  var letters = ['A','B','C','D','E'];
  questions.forEach(function(q, qi) {
    var card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'qcard-' + qi;
    var html = '<div class="q-num">Frage ' + (qi+1) + ' von ' + questions.length + '</div>';
    if (q.sc) html += '<div class="q-sc">' + q.sc + '</div>';
    html += '<div class="q-text">' + q.q + '</div>';
    html += '<div class="opt-list" id="opts-' + qi + '">';
    q.opts.forEach(function(opt, oi) {
      html += '<div class="opt" id="opt-' + qi + '-' + oi + '" onclick="toggleOpt(' + qi + ',' + oi + ')">' +
        '<div class="opt-cb" id="cb-' + qi + '-' + oi + '"></div>' +
        '<span class="opt-letter">' + letters[oi] + '.</span>' +
        '<span class="opt-text">' + opt + '</span></div>';
    });
    html += '</div>';
    card.innerHTML = html;
    container.appendChild(card);
  });
}

function toggleOpt(qi, oi) {
  var idx = userAnswers[qi].indexOf(oi);
  if (idx >= 0) {
    userAnswers[qi].splice(idx, 1);
    document.getElementById('opt-' + qi + '-' + oi).classList.remove('selected');
    document.getElementById('cb-' + qi + '-' + oi).classList.remove('chk');
  } else {
    userAnswers[qi].push(oi);
    document.getElementById('opt-' + qi + '-' + oi).classList.add('selected');
    document.getElementById('cb-' + qi + '-' + oi).classList.add('chk');
  }
  updateSubmitBtn();
  updateProgress();
}

function updateSubmitBtn() {
  var answered = userAnswers.filter(function(a){return a.length>0;}).length;
  document.getElementById('btn-submit').disabled = answered < questions.length;
}

function updateProgress() {
  var answered = userAnswers.filter(function(a){return a.length>0;}).length;
  var pct = questions.length ? (answered/questions.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = answered + ' von ' + questions.length + ' Fragen beantwortet';
}

function submitQuiz() {
  document.getElementById('quiz-section').style.display = 'none';
  document.getElementById('results-section').style.display = 'block';

  var score = 0;
  questions.forEach(function(q, qi) {
    var ua = userAnswers[qi].slice().sort();
    var ca = q.correct.slice().sort();
    if (JSON.stringify(ua) === JSON.stringify(ca)) score++;
  });

  var pct = Math.round(score/questions.length*100);
  var grade, label;
  if (pct >= 90) { grade = 'A'; label = 'Ausgezeichnet'; }
  else if (pct >= 75) { grade = 'B'; label = 'Sehr gut'; }
  else if (pct >= 60) { grade = 'C'; label = 'Gut'; }
  else if (pct >= 45) { grade = 'D'; label = 'Befriedigend'; }
  else { grade = 'E'; label = 'Wiederholen empfohlen'; }

  document.getElementById('result-grade').textContent = grade;
  document.getElementById('result-label').textContent = label + ' — ' + pct + ' %';
  document.getElementById('result-sub').textContent = score + ' von ' + questions.length + ' Fragen vollständig richtig';

  document.getElementById('stats-row').innerHTML =
    '<div class="stat"><div class="stat-n">' + score + '</div><div class="stat-l">Richtig</div></div>' +
    '<div class="stat"><div class="stat-n">' + (questions.length-score) + '</div><div class="stat-l">Falsch</div></div>' +
    '<div class="stat"><div class="stat-n">' + pct + ' %</div><div class="stat-l">Trefferquote</div></div>';

  document.getElementById('comp-bars').innerHTML =
    '<div class="comp-row"><div class="comp-labels"><span>Richtig</span><span>' + score + '/' + questions.length + '</span></div>' +
    '<div class="comp-track"><div class="comp-fill fill-ok" style="width:' + pct + '%"></div></div></div>' +
    '<div class="comp-row"><div class="comp-labels"><span>Verbesserungspotenzial</span><span>' + (questions.length-score) + '/' + questions.length + '</span></div>' +
    '<div class="comp-track"><div class="comp-fill fill-wrong" style="width:' + (100-pct) + '%"></div></div></div>';

  var letters = ['A','B','C','D','E'];
  var rev = document.getElementById('review-container');
  rev.innerHTML = '';
  questions.forEach(function(q, qi) {
    var ua = userAnswers[qi].slice().sort();
    var ca = q.correct.slice().sort();
    var isOk = JSON.stringify(ua) === JSON.stringify(ca);
    var card = document.createElement('div');
    card.className = 'q-card';
    var html = '<div class="q-num">Frage ' + (qi+1) + '</div>';
    if (q.sc) html += '<div class="q-sc">' + q.sc + '</div>';
    html += '<div class="q-text">' + q.q + '</div>';
    html += '<div class="opt-list" style="margin-top:.7rem">';
    q.opts.forEach(function(opt, oi) {
      var sel = ua.indexOf(oi) >= 0;
      var cor = ca.indexOf(oi) >= 0;
      var cls = 'opt disabled ';
      if (sel && cor) cls += 'correct-sel';
      else if (sel && !cor) cls += 'wrong-sel';
      else if (!sel && cor) cls += 'missed';
      var cbCls = 'opt-cb';
      html += '<div class="' + cls + '"><div class="' + cbCls + '"></div>' +
        '<span class="opt-letter">' + letters[oi] + '.</span><span class="opt-text">' + opt + '</span></div>';
    });
    html += '</div>';
    if (q.exp) {
      html += '<div class="feedback ' + (isOk ? 'fb-ok' : 'fb-wrong') + '">';
      html += '<div class="fb-title">' + (isOk ? '✓ Richtig' : '✗ Nicht vollständig richtig') + '</div>';
      html += '<div class="fb-text">' + q.exp + '</div>';
      if (q.src) html += '<div class="fb-source">Quelle: ' + linkify(q.src) + '</div>';
      html += '</div>';
    }
    card.innerHTML = html;
    rev.appendChild(card);
  });

  sendToSheets(score, questions.length - score);
  window.scrollTo({top:0, behavior:'smooth'});
}


function linkify(src) {
  return src.split(' · ').map(function(part) {
    var t = part.trim();
    if (!/\s/.test(t) && /\.[a-zA-Z]{2,}/.test(t) && t.length > 4) {
      var href = /^https?:\/\//i.test(t) ? t : 'https://' + t;
      return '<a href="' + href + '" target="_blank">' + t + '</a>';
    }
    return part;
  }).join(' · ');
}
function sendToSheets(correct, wrong) {
  if (!APPS_SCRIPT_URL) return;
  var TAG_NR = 4;
  var THEMA  = 'Projektinitiierung & Stakeholder-Management';
  var letters = ['A','B','C','D','E'];
  var roleLabels = {a:'KI-Manager:in', b:'Fachbereichsleitung'};
  var stufe = roleLabels[selectedRole] || selectedRole;

  var status = document.getElementById('submit-status');
  if (status) {
    status.className = 'submit-status sending';
    status.style.display = 'block';
    status.textContent = 'Ergebnis wird übermittelt...';
  }

  var toSend = [];
  questions.forEach(function(q, i) {
    var selIndices  = userAnswers[i].slice().sort();
    var corrIndices = q.correct.slice().sort();
    var isFull      = selIndices.join(',') === corrIndices.join(',');
    var gewaehlt    = selIndices.map(function(idx) { return letters[idx]; }).join(',') || '-';
    var korrekt     = corrIndices.map(function(idx) { return letters[idx]; }).join(',');
    var ergebnis    = isFull ? 'RICHTIG' : 'FALSCH';

    toSend.push(
      APPS_SCRIPT_URL
      + '?tab='        + encodeURIComponent('KI-Manager')
      + '&teilnehmer=' + encodeURIComponent(participantName)
      + '&tag='        + TAG_NR
      + '&thema='      + encodeURIComponent(THEMA)
      + '&stufe='      + encodeURIComponent(stufe)
      + '&frage_nr='   + (i + 1)
      + '&frage_text=' + encodeURIComponent(q.q.substring(0, 80))
      + '&gewaehlt='   + encodeURIComponent(gewaehlt)
      + '&korrekt='    + encodeURIComponent(korrekt)
      + '&ergebnis='   + encodeURIComponent(ergebnis)
    );
  });

  toSend.forEach(function(url, i) {
    setTimeout(function() {
      fetch(url, { mode: 'no-cors' }).catch(function() {});
    }, i * 300);
  });
  if (status) {
    setTimeout(function() {
      status.className = 'submit-status success';
      status.textContent = '✓ ' + toSend.length + ' Antworten übermittelt ('
        + new Date().toLocaleTimeString('de-DE') + ')';
    }, toSend.length * 300 + 500);
  }
}
</script>
