<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernkontrolle · Tag 2 · Professionelle KI-Kommunikation & Prompting</title>
<style>
:root {
  --ink:#1a1a18;--paper:#f5f2ec;--card:#fff;--rule:#d5d0c5;--muted:#888880;
  --accent:#2a4a8a;--accent-soft:#e8edf7;
  --level-1:#5a3a7a;--level-1-soft:#f0eaf7;
  --level-2:#0a5a7a;--level-2-soft:#e0eff7;
  --correct:#2a7a50;--correct-bg:#eaf5ee;--correct-border:#a0d8b8;
  --wrong:#9a2a2a;--wrong-bg:#faeaea;--wrong-border:#d8a0a0;--missed:#b85c00;--missed-bg:#fff4e6;--missed-border:#f0b070;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;font-size:15px;}
a{color:var(--accent);}
.site-header{border-bottom:2px solid var(--ink);padding:1.8rem 2rem 1.4rem;max-width:820px;margin:0 auto;}
.eyebrow{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;}
.site-header h1{font-family:Georgia, "Times New Roman", serif;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.15;margin-bottom:.4rem;}
.header-meta{font-size:12px;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap;}
.header-meta span::before{content:"· ";}
.header-meta span:first-child::before{content:"";}
.main{max-width:820px;margin:0 auto;padding:1.8rem 2rem 4rem;}
.setup-card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:2rem;max-width:480px;margin:0 auto;}
.setup-card h2{font-family:Georgia, "Times New Roman", serif;font-size:1.3rem;margin-bottom:1.2rem;}
.field-label{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.35rem;}
.setup-input{width:100%;border:1px solid var(--rule);border-radius:8px;padding:.6rem .9rem;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:14px;background:var(--paper);outline:none;color:var(--ink);transition:border-color .15s;}
.setup-input:focus{border-color:var(--ink);}
.hint-text{font-size:12px;color:var(--muted);margin-top:.3rem;display:block;}
.level-btns{display:flex;gap:.5rem;margin-top:.3rem;}
.sel-btn{flex:1;padding:.55rem .6rem;border:1px solid var(--rule);border-radius:8px;background:none;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:13px;cursor:pointer;text-align:center;transition:all .15s;color:var(--ink);}
.sel-btn.active-1{background:var(--level-1-soft);border-color:var(--level-1);color:var(--level-1);font-weight:500;}
.sel-btn.active-2{background:var(--level-2-soft);border-color:var(--level-2);color:var(--level-2);font-weight:500;}
.btn-start{width:100%;padding:.75rem;background:var(--ink);color:#fff;border:none;border-radius:8px;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:1rem;transition:background .15s;}
.btn-start:hover{background:#333;}
.btn-start:disabled{background:#aaa;cursor:not-allowed;}
.quiz-header-strip{display:flex;gap:.6rem;align-items:center;margin-bottom:1.4rem;flex-wrap:wrap;}
.strip-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:100px;letter-spacing:.5px;}
.strip-role-1{background:var(--level-1-soft);color:var(--level-1);}
.strip-role-2{background:var(--level-2-soft);color:var(--level-2);}
.strip-name{font-size:12px;color:var(--muted);}
.separator-card{background:var(--accent-soft);border:1px solid var(--rule);border-radius:12px;padding:1.2rem 1.5rem;margin:1.5rem 0;text-align:center;}
.separator-card h3{font-family:Georgia,serif;font-size:1.1rem;color:var(--accent);margin:0;}
.progress-bar{height:3px;background:var(--rule);border-radius:2px;margin-bottom:1.2rem;}
.progress-fill{height:100%;background:var(--ink);border-radius:2px;transition:width .3s;}
.progress-label{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:10px;color:var(--muted);margin-bottom:.5rem;}
.q-card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:1.5rem;margin-bottom:1rem;}
.q-num{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem;}
.q-text{font-size:15px;font-weight:500;line-height:1.55;margin-bottom:.5rem;}
.q-hint{font-size:12px;color:var(--muted);margin-bottom:.9rem;font-style:italic;}
.opt-list{display:flex;flex-direction:column;gap:.5rem;}
.opt{display:flex;align-items:flex-start;gap:.7rem;padding:.75rem 1rem;border:1px solid var(--rule);border-radius:8px;cursor:pointer;background:#fdfdfb;transition:all .12s;-webkit-user-select:none;user-select:none;}
.opt:hover:not(.disabled){border-color:#888;background:#f5f2ec;}
.opt.selected{background:var(--accent-soft);border-color:#8090b8;}
.opt.disabled{cursor:default;}
.opt.correct-sel{background:var(--correct-bg);border-color:var(--correct-border);}
.opt.wrong-sel{background:var(--wrong-bg);border-color:var(--wrong-border);}
.opt.missed{background:var(--missed-bg);border-color:var(--missed-border);}
.opt-cb{width:18px;height:18px;min-width:18px;border:1.5px solid #bbb;border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.opt-cb.chk{background:var(--ink);border-color:var(--ink);}
.opt-cb.chk::after{content:'';display:block;width:8px;height:8px;background:#fff;border-radius:2px;}
.opt.correct-sel .opt-cb{background:var(--correct);border-color:var(--correct);}
.opt.correct-sel .opt-cb::after{content:'✓';color:#fff;font-size:11px;background:none;width:auto;height:auto;}
.opt.wrong-sel .opt-cb{background:var(--wrong);border-color:var(--wrong);}
.opt.wrong-sel .opt-cb::after{content:'✗';color:#fff;font-size:11px;background:none;width:auto;height:auto;}
.opt.missed .opt-cb{background:var(--missed);border-color:var(--missed);}
.opt.missed .opt-cb::after{content:'→';color:#fff;font-size:11px;background:none;width:auto;height:auto;}
.opt-letter{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;font-size:12px;color:var(--muted);min-width:16px;flex-shrink:0;margin-top:2px;}
.opt-text{font-size:14px;line-height:1.5;}
.feedback{border-radius:8px;padding:.9rem 1.1rem;margin-top:.9rem;}
.feedback.fb-ok{background:var(--correct-bg);border:1px solid var(--correct-border);}
.feedback.fb-wrong{background:var(--wrong-bg);border:1px solid var(--wrong-border);}
.fb-title{font-weight:500;font-size:14px;margin-bottom:.4rem;}
.fb-ok .fb-title{color:var(--correct);}
.fb-wrong .fb-title{color:var(--wrong);}
.fb-text{font-size:13px;line-height:1.65;color:#444;margin-bottom:.5rem;}
.fb-source{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:.5rem;}
.btn{display:inline-flex;align-items:center;padding:.55rem 1.2rem;border:1px solid var(--rule);border-radius:8px;background:none;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink);transition:all .15s;}
.btn:hover{background:var(--paper);border-color:#888;}
.btn-full{width:100%;justify-content:center;padding:.7rem;font-size:15px;margin-top:1rem;}
.btn-submit{background:#2a5c3f;color:#fff;border-color:#2a5c3f;}
.btn-submit:hover{background:#1e4530;}
.result-block{max-width:600px;margin:0 auto;text-align:center;}
.result-grade{font-family:Georgia, "Times New Roman", serif;font-size:4.5rem;line-height:1;margin-bottom:.3rem;}
.result-label{font-size:1.1rem;font-weight:500;margin-bottom:.3rem;}
.result-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem;}
.stats-row{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:.9rem 1.2rem;text-align:center;min-width:90px;}
.stat-n{font-size:1.8rem;font-weight:500;}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px;}
.comp-title{font-size:13px;font-weight:500;text-align:left;margin-bottom:.8rem;}
.comp-row{margin-bottom:.7rem;text-align:left;}
.comp-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px;}
.comp-track{height:4px;background:var(--rule);border-radius:2px;}
.comp-fill{height:100%;border-radius:2px;}
.fill-ok{background:var(--correct);}
.fill-wrong{background:var(--wrong);}
.submit-status{display:none;font-size:12px;margin-top:.5rem;padding:.4rem .8rem;border-radius:6px;}
.submit-status.sending{display:block;background:#fffbe8;color:#806a00;border:1px solid #d0c060;}
.submit-status.success{display:block;background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct-border);}
.submit-status.error{display:block;background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong-border);}
</style>
</head>
<body>

<header class="site-header">
  <div class="eyebrow">Alfatraining · KI-Beauftragte:r · Tag 2</div>
  <h1>Lernkontrolle<br>Professionelle KI-Kommunikation &amp; Prompting</h1>
  <div class="header-meta">
    <span>10 Fragen</span>
    <span>Eine oder mehrere Antworten können richtig sein</span>
  </div>
</header>

<main class="main">

<!-- ── SETUP ── -->
<div id="setup-section">
  <div class="setup-card">
    <h2>Quiz starten</h2>

    <div style="margin-bottom:1.2rem;">
      <span class="field-label">Dein Name (oder Teilnehmer-Nummer)</span>
      <input type="text" id="participant-name" class="setup-input" placeholder="z. B. Teilnehmer-07 oder Vorname">
    </div>

    <button class="btn-start" id="btn-start" onclick="startQuiz()">Quiz starten</button>
  </div>
</div>

<!-- ── QUIZ ── -->
<div id="quiz-section" style="display:none">
  <div class="quiz-header-strip" id="quiz-header-strip"></div>
  <div class="progress-label" id="progress-label"></div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <div id="questions-container"></div>

  <div style="margin-top:1.5rem">
    <button class="btn btn-submit btn-full" id="btn-submit" onclick="submitQuiz()" disabled>Auswertung anzeigen →</button>
  </div>
  <div class="submit-status" id="submit-status"></div>
</div>

<!-- ── RESULTS ── -->
<div id="results-section" style="display:none">
  <div class="result-block">
    <div class="result-grade" id="result-grade"></div>
    <div class="result-label" id="result-label"></div>
    <div class="result-sub" id="result-sub"></div>
    <div class="stats-row" id="stats-row"></div>
    <div class="comp-title">Kompetenzprofil</div>
    <div id="comp-bars"></div>
    <div style="margin-top:.8rem;display:flex;justify-content:center;">
      <button class="btn" onclick="location.reload()">Neu starten</button>
    </div>
    </div>

  <hr style="border:none;border-top:1px solid var(--rule);margin:2rem 0">
  <h2 style="font-family:Georgia, serif;font-size:1.2rem;margin-bottom:1rem">Detailauswertung</h2>
  <div id="review-container"></div>
</div>

</main>

<script>
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPs358GF_E1xsvTh08PpTpZcBDS1OvsU9XQ0qi0MkZoCCnAk4dyo3Aii0OYxILdvCRYA/exec';

/* ═══════ FRAGENBANK ═══════════════════════════════════════════ */
/* Verteilung: 2x eine richtig, 4x zwei richtig, 4x drei richtig; nie vier */

var QUESTIONS = [
  /* ═══════ SET 1: KI-Beauftragte:r (Fragen 1-5) ═══════ */
  {
    set: 'KI-Beauftragte:r',
    q: 'Du baust als KI-Beauftragte:r eine Prompt-Bibliothek für dein Unternehmen auf. Ein Kollege fragt, warum einfache Anweisungen wie „Schreib eine Stellenausschreibung“ nicht ausreichen. Welche Aussage(n) zum RCKF-Schema sind korrekt?',
    opts: [
      'Das RCKF-Schema (Rolle · Kontext · Kernaufgabe · Format) strukturiert Prompts so, dass das Modell gezielt auf die Unternehmenssituation eingehen kann.',
      'Rollenzuweisungen haben keinen messbaren Einfluss auf die Qualität der Ausgabe — das Modell ignoriert solche Angaben.',
      'Ohne Kontext erzeugt das Modell statistische Durchschnittsantworten, die für kein Unternehmen wirklich passen.',
      'Das RCKF-Schema ist eine gesetzliche Pflicht nach Artikel 4 der KI-Verordnung.'
    ],
    correct: [0,2],
    exp: 'Das RCKF-Schema strukturiert Prompts mit Rolle, Kontext, Kernaufgabe und Format. Ohne Kontext liefert das Modell generische Antworten, weil es nicht weiß, für welche Situation die Ausgabe gedacht ist. Rollenzuweisungen verbessern nachweislich Stil und Detailgrad. Das Schema ist Best Practice, keine gesetzliche Pflicht — Artikel 4 fordert KI-Kompetenz, schreibt aber keine bestimmte Prompting-Methode vor.',
    src: 'Dyck/Spann – KI in der Führung (Haufe 2025)', url: 'https://www.haufe.de/isbn/9783648184745'
  },
  {
    set: 'KI-Beauftragte:r',
    q: 'Ein KI-generierter Bericht enthält eine falsche Rechtsauskunft, die beinahe an einen Kunden weitergegeben wurde. Du analysierst als KI-Beauftragte:r den Vorfall. Welche Aussage(n) zu Halluzinationen sind korrekt?',
    opts: [
      'Halluzinationen entstehen, weil das Modell statistisch wahrscheinliche Fortsetzungen generiert — nicht weil es bewusst falsche Informationen erzeugt.',
      'Die Singleton-Regel (Kalai et al. 2025) zeigt: Je seltener ein Fakt in den Trainingsdaten vorkommt, desto höher ist die Halluzinationswahrscheinlichkeit.',
      'Halluzinationen lassen sich durch sorgfältige Prompt-Formulierung und Quellenangaben im Prompt reduzieren, aber nicht vollständig eliminieren.',
      'Aktuelle Sprachmodelle können zuverlässig zwischen Fakten und Vermutungen unterscheiden und halluzinieren nur bei technischen Fehlern.'
    ],
    correct: [0,1,2],
    exp: 'Halluzinationen sind systemimmanent: Das Modell generiert die statistisch wahrscheinlichste Fortsetzung, ohne zu „wissen“, ob sie stimmt. Die Singleton-Regel zeigt mathematisch, dass seltene Fakten besonders betroffen sind. Präzise Prompts und die Aufforderung zur Quellenangabe reduzieren das Risiko, eliminieren es aber nicht. Aktuelle Modelle können nicht zuverlässig zwischen Fakten und Vermutungen unterscheiden — das ist gerade der Kern des Problems.',
    src: 'Kalai et al. 2025 · arXiv:2509.04664', url: 'https://arxiv.org/abs/2509.04664'
  },
  {
    set: 'KI-Beauftragte:r',
    q: 'Du entwickelst als KI-Beauftragte:r eine Nutzungsrichtlinie für KI-Tools im Unternehmen. Bei der Datenschutzprüfung stößt du auf die Frage, welche Daten in externe KI-Systeme eingegeben werden dürfen. Welche Aussage(n) sind korrekt?',
    opts: [
      'Jede Eingabe personenbezogener Daten in ein externes KI-System erfordert eine Rechtsgrundlage nach DSGVO Art. 6 und — bei Auftragsverarbeitung — einen AVV nach Art. 28.',
      'ChatGPT Business ist automatisch DSGVO-konform, da es ein Business-Produkt ist — ein gesonderter AVV ist nicht erforderlich.',
      'Anonymisierte Daten funktionieren in Prompts fast genauso gut und umgehen das Datenschutzproblem strukturell.',
      'Solange keine explizite Verbotsliste existiert, dürfen Mitarbeitende alle Firmendaten in KI-Tools eingeben.'
    ],
    correct: [0,2],
    exp: 'Personenbezogene Daten in einem externen KI-System lösen DSGVO-Pflichten aus: Rechtsgrundlage und ggf. AVV. Business-Tarife allein garantieren keine Konformität — der AVV muss explizit geprüft werden. Anonymisierte Daten sind eine praktikable Alternative, weil sie den Datenschutz strukturell lösen. Ohne explizite Nutzungsrichtlinie dürfen Mitarbeitende nicht einfach beliebige Daten eingeben — die Grundsätze der Datenminimierung gelten immer.',
    src: 'DSGVO Art. 28', url: 'https://dsgvo-gesetz.de/art-28-dsgvo/'
  },
  {
    set: 'KI-Beauftragte:r',
    q: 'Du bewertest als KI-Beauftragte:r ein neues KI-System, das E-Mails von Kunden liest, auf interne Personaldaten zugreift und automatisch Antworten versendet. Welche Aussage(n) zum Sicherheitsrisiko sind korrekt?',
    opts: [
      'Das System kombiniert alle drei Elemente des Letalen Trifektas: externe Inhalte, Zugang zu privaten Daten und Außenkommunikation — das maximale Risikoprofil.',
      'Prompt Injection ist hier besonders gefährlich: Versteckte Anweisungen in Kunden-E-Mails könnten das System dazu bringen, interne Daten nach außen zu geben.',
      'Solange das System nur liest und nicht schreibt, besteht kein Prompt-Injection-Risiko.',
      'Die Regel lautet: Nie alle drei Elemente gleichzeitig aktivieren — mindestens eines muss durch Prozesse oder Technik kontrolliert werden.'
    ],
    correct: [0,1,3],
    exp: 'Das Letale Trifekta (Simon Willison, OWASP LLM Top 10) beschreibt die gefährlichste Kombination: externe nicht vertrauenswürdige Inhalte + Zugang zu privaten Daten + Außenkommunikation. Prompt Injection kann versteckte Anweisungen in E-Mails nutzen, um über das System interne Daten abzugreifen. Auch lesende Systeme sind gefährdet, wenn sie auf private Daten zugreifen und gleichzeitig Ausgaben nach außen senden. Die Faustregel: Mindestens ein Element muss kontrolliert oder deaktiviert sein.',
    src: 'Simon Willison · OWASP LLM Top 10', url: 'https://owasp.org/www-project-top-10-for-large-language-model-applications/'
  },
  {
    set: 'KI-Beauftragte:r',
    q: 'Die Geschäftsführung fragt dich als KI-Beauftragte:r, was der Hauptzweck einer unternehmensweiten Prompt-Bibliothek ist. Welche Aussage(n) ist oder sind korrekt?',
    opts: [
      'Die Prompt-Bibliothek ersetzt die Schulung der Mitarbeitenden im Umgang mit KI-Tools.',
      'Die Prompt-Bibliothek stellt konsistente, reproduzierbare Ergebnisqualität sicher und unterstützt Governance- und Compliance-Anforderungen durch drei Schichten: Register, Operationalisierung und Kontrolle.',
      'Die Prompt-Bibliothek verhindert, dass Mitarbeitende eigene Prompts entwickeln.',
      'Die Prompt-Bibliothek ist eine gesetzliche Pflicht nach dem EU AI Act und muss der Bundesnetzagentur vorgelegt werden.'
    ],
    correct: [1],
    exp: 'Eine Prompt-Bibliothek sichert Qualität und Konsistenz über drei Schichten: Register (Inventar aller Prompts und Anwendungsfälle), Operationalisierung (Custom GPTs, geteilte Vorlagen) und Kontrolle (Review, Audit, Freigabe, Versionierung). Sie ersetzt weder Schulungen noch unterbindet sie eigene Kreativität. Es gibt keine gesetzliche Pflicht zur Vorlage bei der Bundesnetzagentur, aber sie ist ein faktisches Muss zur Umsetzung der Kompetenzpflicht nach Artikel 4.',
    src: 'Dyck/Spann – KI in der Führung (Haufe 2025)', url: 'https://www.haufe.de/isbn/9783648184745'
  },

  /* ═══════ SET 2: Anwender:in (Fragen 6-10) ═══════ */
  {
    set: 'Anwender:in',
    q: 'Du möchtest mit ChatGPT eine Stellenausschreibung für eine Bauleiterin im Hochbau erstellen. Welcher Prompt erzeugt die beste Ausgabe?',
    opts: [
      '„Schreib eine Stellenausschreibung für eine Bauleiterin.“',
      '„Du bist eine erfahrene HR-Fachkraft im Bauwesen. Wir sind ein Bauplanungsbüro, 40 Mitarbeitende, suchen eine Bauleiterin Hochbau in Bremen. Schreib eine diskriminierungsfreie Stellenausschreibung. Format: Aufgaben · Profil · Angebot. Max. 300 Wörter.“',
      '„Bauleiterin gesucht, Hochbau, Bremen, 40 MA, professionell.“',
      '„Erstelle eine Stellenanzeige. Sei kreativ und modern.“'
    ],
    correct: [1],
    exp: 'Der stärkste Prompt enthält alle vier RCKF-Bausteine: Rolle (HR-Fachkraft im Bauwesen), Kontext (Bürogröße, Standort, Branche), Kernaufgabe (diskriminierungsfreie Stellenausschreibung) und Format (Struktur, Länge). Die anderen Prompts sind zu vage — dem Modell fehlt Kontext, um eine für das konkrete Unternehmen brauchbare Ausgabe zu erzeugen.',
    src: 'Dyck/Spann – KI in der Führung (Haufe 2025)', url: 'https://www.haufe.de/isbn/9783648184745'
  },
  {
    set: 'Anwender:in',
    q: 'Du nutzt ChatGPT regelmäßig für Absageschreiben. Deine Kollegin bekommt mit demselben Tool deutlich inkonsistentere Ergebnisse. Welche Aussage(n) zur Konsistenz von KI-Ausgaben sind korrekt?',
    opts: [
      'Few-Shot-Prompting — also das Mitgeben von Beispielausgaben im Prompt — ist der stärkste Hebel für konsistente Ergebnisse.',
      'Die Konsistenz hängt ausschließlich vom Modell ab — unterschiedliche Prompts haben keinen Einfluss auf die Qualität.',
      'System-Prompt und Formatvorgaben sind die wirksamsten Stellschrauben, die auch ohne API-Zugang greifen.',
      'Die Temperatur-Einstellung lässt sich in der ChatGPT-Oberfläche direkt einstellen und löst das Konsistenzproblem sofort.'
    ],
    correct: [0,2],
    exp: 'Inkonsistente Ergebnisse entstehen fast immer durch unterschiedliche Prompt-Strukturen, nicht durch Modellschwächen. Few-Shot-Prompting (Beispielausgaben im Prompt) ist der stärkste Qualitätshebel. System-Prompt und Formatvorgaben greifen auch ohne API-Zugang. Die Temperatur-Einstellung ist in der ChatGPT-Oberfläche nicht direkt zugänglich — sie funktioniert nur über die API.',
    src: 'Prompting Guide (DAIR.AI)', url: 'https://www.promptingguide.ai/'
  },

/* ═══════ STATE ════════════════════════════════════════════════ */
var S = { name:'', questions:[], selections:[], submitted:false };

function startQuiz() {
  S.name = document.getElementById('participant-name').value.trim() || 'Anonym';
  S.questions = QUESTIONS.map(function(q){
    var n=q.opts.length, idx=[];
    for(var k=0;k<n;k++) idx.push(k);
    for(var j=n-1;j>0;j--){ var r=Math.floor(Math.random()*(j+1)),t=idx[j];idx[j]=idx[r];idx[r]=t; }
    return {
      set:q.set,
      q:q.q,
      opts:idx.map(function(i){return q.opts[i];}),
      correct:q.correct.map(function(c){return idx.indexOf(c);}),
      exp:q.exp, src:q.src, url:q.url
    };
  });
  S.selections = S.questions.map(function(){return [];});
  S.submitted = false;

  document.getElementById('setup-section').style.display='none';
  document.getElementById('quiz-section').style.display='block';

  document.getElementById('quiz-header-strip').innerHTML =
    '<span class="strip-tag strip-role-1">KI-Beauftragte:r</span>'
    +'<span class="strip-tag strip-role-2">Anwender:in</span>'
    +'<span class="strip-name">'+S.name+'</span>';

  renderQuestions();
}

function renderQuestions() {
  var container = document.getElementById('questions-container');
  container.innerHTML = '';
  var total = S.questions.length;
  var letters = ['A','B','C','D'];

  S.questions.forEach(function(q, qi) {
    if (qi === 5) {
      var sep = document.createElement('div');
      sep.className = 'separator-card';
      sep.innerHTML = '<h3>Perspektivwechsel: Anwender:in</h3>';
      container.appendChild(sep);
    }

    var card = document.createElement('div');
    card.className = 'q-card';

    var numEl = document.createElement('div');
    numEl.className = 'q-num';
    numEl.textContent = 'Frage '+(qi+1)+' von '+total;
    card.appendChild(numEl);

    var qEl = document.createElement('div');
    qEl.className = 'q-text';
    qEl.textContent = q.q;
    card.appendChild(qEl);

    var hEl = document.createElement('div');
    hEl.className = 'q-hint';
    hEl.textContent = 'Eine oder mehrere Antworten können richtig sein.';
    card.appendChild(hEl);

    var optList = document.createElement('div');
    optList.className = 'opt-list';

    q.opts.forEach(function(opt, oi) {
      var row = document.createElement('div');
      row.className = 'opt';
      row.id = 'opt-'+qi+'-'+oi;
      row.onclick = (function(a,b){ return function(){ toggleOpt(a,b); }; })(qi,oi);

      var cb = document.createElement('div');
      cb.className = 'opt-cb';
      cb.id = 'cb-'+qi+'-'+oi;
      row.appendChild(cb);

      var letter = document.createElement('div');
      letter.className = 'opt-letter';
      letter.textContent = letters[oi]+'.';
      row.appendChild(letter);

      var text = document.createElement('div');
      text.className = 'opt-text';
      text.textContent = opt;
      row.appendChild(text);

      optList.appendChild(row);
    });

    card.appendChild(optList);
    var fb = document.createElement('div');
    fb.id = 'fb-'+qi;
    card.appendChild(fb);
    container.appendChild(card);
  });

  updateProgress();
}

function toggleOpt(qi, oi) {
  if (S.submitted) return;
  var sel = S.selections[qi];
  var pos = sel.indexOf(oi);
  if (pos >= 0) sel.splice(pos,1); else sel.push(oi);
  document.getElementById('cb-'+qi+'-'+oi).className = 'opt-cb'+(sel.indexOf(oi)>=0?' chk':'');
  document.getElementById('opt-'+qi+'-'+oi).className = 'opt'+(sel.indexOf(oi)>=0?' selected':'');
  checkSubmitReady();
  updateProgress();
}

function checkSubmitReady() {
  document.getElementById('btn-submit').disabled =
    S.selections.filter(function(s){return s.length>0;}).length < S.questions.length;
}

function updateProgress() {
  var answered = S.selections.filter(function(s){return s.length>0;}).length;
  document.getElementById('progress-fill').style.width = Math.round(answered/S.questions.length*100)+'%';
  document.getElementById('progress-label').textContent = answered+' von '+S.questions.length+' Fragen beantwortet';
}

function submitQuiz() {
  S.submitted = true;
  document.getElementById('btn-submit').disabled = true;
  var correct=0, wrong=0;

  S.questions.forEach(function(q, qi) {
    var sel = S.selections[qi].slice().sort().join(',');
    var cor = q.correct.slice().sort().join(',');
    var isFull = sel===cor;
    if (isFull) correct++; else wrong++;

    q.opts.forEach(function(opt,oi){
      var isSel = S.selections[qi].indexOf(oi)>=0;
      var isCorr = q.correct.indexOf(oi)>=0;
      document.getElementById('opt-'+qi+'-'+oi).className =
        'opt disabled'+(isSel&&isCorr?' correct-sel':isSel&&!isCorr?' wrong-sel':!isSel&&isCorr?' missed':'');
      document.getElementById('cb-'+qi+'-'+oi).className = 'opt-cb'+(isSel?' chk':'');
    });

    document.getElementById('fb-'+qi).innerHTML =
      '<div class="feedback '+(isFull?'fb-ok':'fb-wrong')+'">'
      +'<div class="fb-title">'+(isFull?'Richtig — alle Antworten korrekt.':'Falsch — nicht alle richtigen Antworten gewählt oder falsche angekreuzt.')+'</div>'
      +'<div class="fb-text">'+q.exp+'</div>'
      +'<div class="fb-source">Quelle: <a href="'+q.url+'" target="_blank">'+q.src+'</a></div>'
      +'</div>';
  });

  showResults(correct, wrong);
  sendToSheets(correct, wrong);
}

function showResults(correct, wrong) {
  var total = S.questions.length;
  var pct = Math.round(correct/total*100);
  var grade, label, sub;
  if(pct>=80){grade='A';label='Sehr gut!';sub='Prüfungsreife für dieses Thema nachgewiesen.';}
  else if(pct>=60){grade='B';label='Gut';sub='Solide Basis — Quellenlinks gezielt nutzen.';}
  else if(pct>=40){grade='C';label='Ausbaufähig';sub='Grundlagen vorhanden — Theorieblock nochmals lesen.';}
  else{grade='D';label='Weiter üben';sub='Lücken mit den verlinkten Quellen schließen.';}

  document.getElementById('result-grade').textContent=grade;
  document.getElementById('result-label').textContent=label;
  document.getElementById('result-sub').textContent=sub;
  document.getElementById('stats-row').innerHTML=
    '<div class="stat"><div class="stat-n" style="color:var(--correct)">'+correct+'</div><div class="stat-l">Richtig</div></div>'
    +'<div class="stat"><div class="stat-n" style="color:var(--wrong)">'+wrong+'</div><div class="stat-l">Falsch</div></div>'
    +'<div class="stat"><div class="stat-n">'+pct+'%</div><div class="stat-l">Ergebnis</div></div>';

  document.getElementById('comp-bars').innerHTML=S.questions.map(function(q,i){
    var ok=S.selections[i].slice().sort().join(',')===q.correct.slice().sort().join(',');
    return '<div class="comp-row"><div class="comp-labels"><span>Frage '+(i+1)+'</span>'
      +'<span style="color:'+(ok?'var(--correct)':'var(--wrong)')+'">'+(ok?'✓ Richtig':'✗ Falsch')+'</span></div>'
      +'<div class="comp-track"><div class="comp-fill '+(ok?'fill-ok':'fill-wrong')+'" style="width:'+(ok?100:0)+'%"></div></div></div>';
  }).join('');

  renderReview();
  document.getElementById('quiz-section').style.display='none';
  document.getElementById('results-section').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderReview() {
  var letters = ['A','B','C','D'];
  var container = document.getElementById('review-container');
  container.innerHTML = '';

  S.questions.forEach(function(q, qi) {
    var isFull = S.selections[qi].slice().sort().join(',')===q.correct.slice().sort().join(',');
    var card = document.createElement('div');
    card.className = 'q-card';
    card.style.marginBottom = '.8rem';

    var header = document.createElement('div');
    header.style.cssText = 'display:flex;gap:.6rem;align-items:baseline;margin-bottom:.5rem;';
    var numEl = document.createElement('div');
    numEl.className = 'q-num';
    numEl.textContent = 'Frage '+(qi+1);
    var badge = document.createElement('span');
    badge.style.cssText = 'font-size:12px;font-weight:500;padding:2px 10px;border-radius:100px;'
      +(isFull?'background:var(--correct-bg);color:var(--correct);':'background:var(--wrong-bg);color:var(--wrong);');
    badge.textContent = isFull?'✓ Richtig':'✗ Falsch';
    header.appendChild(numEl); header.appendChild(badge);
    card.appendChild(header);

    var qEl = document.createElement('div');
    qEl.className = 'q-text';
    qEl.style.marginBottom = '.7rem';
    qEl.textContent = q.q;
    card.appendChild(qEl);

    var optList = document.createElement('div');
    optList.className = 'opt-list';
    q.opts.forEach(function(opt, oi) {
      var isSel = S.selections[qi].indexOf(oi)>=0;
      var isCorr = q.correct.indexOf(oi)>=0;
      var row = document.createElement('div');
      var cls = 'opt disabled';
      if(isSel&&isCorr) cls+=' correct-sel';
      else if(isSel&&!isCorr) cls+=' wrong-sel';
      else if(!isSel&&isCorr) cls+=' missed';
      row.className = cls;
      var cb = document.createElement('div');
      cb.className = 'opt-cb'+(isSel?' chk':'');
      row.appendChild(cb);
      var letter = document.createElement('div');
      letter.className = 'opt-letter';
      letter.textContent = letters[oi]+'.';
      row.appendChild(letter);
      var text = document.createElement('div');
      text.className = 'opt-text';
      text.textContent = opt;
      row.appendChild(text);
      optList.appendChild(row);
    });
    card.appendChild(optList);

    var fb = document.createElement('div');
    fb.innerHTML = '<div class="feedback '+(isFull?'fb-ok':'fb-wrong')+'" style="margin-top:.7rem">'
      +'<div class="fb-title">'+(isFull?'Richtig.':'Falsch.')+'</div>'
      +'<div class="fb-text">'+q.exp+'</div>'
      +'<div class="fb-source">Quelle: <a href="'+q.url+'" target="_blank">'+q.src+'</a></div></div>';
    card.appendChild(fb);
    container.appendChild(card);
  });
}

function sendToSheets(correct, wrong) {
  if (!APPS_SCRIPT_URL) return;
  var TAG_NR = 2;
  var THEMA  = 'KI-Kommunikation & Prompting';
  var letters = ['A','B','C','D'];
  var status = document.getElementById('submit-status');
  status.className = 'submit-status sending';
  status.style.display = 'block';
  status.textContent = 'Ergebnis wird übermittelt...';

  var toSend = [];
  S.questions.forEach(function(q, i) {
    var selIndices  = S.selections[i].slice().sort();
    var corrIndices = q.correct.slice().sort();
    var isFull      = selIndices.join(',') === corrIndices.join(',');
    var gewaehlt    = selIndices.map(function(idx) { return letters[idx]; }).join(',') || '-';
    var korrekt     = corrIndices.map(function(idx) { return letters[idx]; }).join(',');
    var ergebnis    = isFull ? 'RICHTIG' : 'FALSCH';

    toSend.push(
      APPS_SCRIPT_URL
      + '?tab='        + encodeURIComponent('KI-Beauftragter')
      + '&teilnehmer=' + encodeURIComponent(S.name)
      + '&tag='        + TAG_NR
      + '&thema='      + encodeURIComponent(THEMA)
      + '&stufe='      + encodeURIComponent(S.questions[i].set)
      + '&frage_nr='   + (i + 1)
      + '&frage_text=' + encodeURIComponent(q.q.substring(0, 80))
      + '&gewaehlt='   + encodeURIComponent(gewaehlt)
      + '&korrekt='    + encodeURIComponent(korrekt)
      + '&ergebnis='   + encodeURIComponent(ergebnis)
    );
  });

  var idx = 0;
  function sendNext() {
    if (idx >= toSend.length) {
      status.className = 'submit-status success';
      status.textContent = '✓ ' + toSend.length + ' Antworten übermittelt ('
        + new Date().toLocaleTimeString('de-DE') + ')';
      return;
    }
    fetch(toSend[idx], { mode: 'no-cors' })
      .catch(function() {})
      .then(function() { idx++; setTimeout(sendNext, 400); });
  }
  sendNext();
}

</script>
