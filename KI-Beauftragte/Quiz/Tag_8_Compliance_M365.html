<title>Lernkontrolle · Tag 8 · Compliance & Microsoft 365</title>
<style>
:root{
  --ink:#1a1a18;--paper:#f8f6f1;--card:#ffffff;--rule:#d5d0c5;--muted:#6b6b60;
  --accent:#0a4a7a;--teal:#0a6b6b;--green:#2a5c3f;--red:#8b1a1a;
  --correct-bg:#e8f5e9;--correct-border:#66bb6a;
  --wrong-bg:#fce4ec;--wrong-border:#ef9a9a;
  --missed-bg:#fff4e6;--missed-border:#f0b070;--missed:#b85c00;
  --phase:#f2f0eb;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.65;}
.page{max-width:820px;margin:0 auto;padding:2.5rem 2rem 5rem;}
.ho-header{border-bottom:3px solid var(--ink);padding-bottom:1.5rem;margin-bottom:2rem;}
.ho-eyebrow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.15;margin-bottom:.5rem;}
.setup-card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:1.8rem;max-width:420px;margin:0 auto 2rem;}
.setup-card h2{font-family:'Playfair Display',Georgia,serif;font-size:1.2rem;margin-bottom:1.2rem;}
.field-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.3rem;}
.setup-input{width:100%;border:1px solid var(--rule);border-radius:6px;padding:.55rem .8rem;font-size:14px;background:var(--paper);outline:none;color:var(--ink);}
.setup-input:focus{border-color:var(--ink);}
.btn-start{width:100%;padding:.7rem;background:var(--ink);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;margin-top:1rem;}
.btn-start:hover{background:#333;}
.role-label{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:100px;margin:1.5rem 0 .8rem;font-weight:600;}
.role-kib{background:#e3f0fa;color:var(--accent);border:1px solid #b0cfe0;}
.role-two{background:#e8f5e9;color:var(--green);border:1px solid #a5d6a7;}
.q-card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:1.2rem 1.4rem;margin-bottom:1.2rem;}
.q-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:.4rem;}
.q-text{font-size:14px;font-weight:500;margin-bottom:.8rem;line-height:1.55;}
.q-hint{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:.6rem;}
.opt-list{list-style:none;padding:0;}
.opt-list li{display:flex;align-items:flex-start;gap:.6rem;padding:.45rem .6rem;border-radius:6px;margin-bottom:.3rem;font-size:13.5px;line-height:1.5;cursor:pointer;border:1px solid transparent;-webkit-user-select:none;user-select:none;}
.opt-list li:hover:not(.disabled){background:var(--phase);}
.opt-list li.disabled{cursor:default;}
.opt-list li.selected{background:#e8edf7;border-color:#8090b8;}
.opt-box{width:18px;height:18px;border:2px solid var(--rule);border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;}
.opt-list li.selected .opt-box{border-color:var(--accent);background:var(--accent);}
.opt-list li.correct-sel{background:var(--correct-bg);border-color:var(--correct-border);}
.opt-list li.correct-sel .opt-box{border-color:var(--green);background:var(--green);}
.opt-list li.wrong-sel{background:var(--wrong-bg);border-color:var(--wrong-border);}
.opt-list li.wrong-sel .opt-box{border-color:var(--red);background:var(--red);}
.opt-list li.missed{background:var(--missed-bg);border-color:var(--missed-border);}
.opt-list li.missed .opt-box{border-color:var(--missed);background:var(--missed);}
.exp{display:none;background:#f5f5f0;border-left:3px solid var(--teal);padding:.7rem 1rem;margin-top:.7rem;border-radius:0 6px 6px 0;font-size:12.5px;line-height:1.6;color:var(--ink);}
.exp.visible{display:block;}
.exp-src{font-size:11px;color:var(--muted);margin-top:.4rem;border-top:1px solid var(--rule);padding-top:.35rem;}
.btn-row{display:flex;gap:.8rem;margin-top:.7rem;}
.btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;padding:7px 18px;border:1px solid var(--rule);border-radius:5px;background:var(--card);color:var(--ink);cursor:pointer;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent);}
.btn.primary:hover{background:#08396a;}
.btn.submit-btn{background:var(--green);color:white;border-color:var(--green);font-size:12px;padding:9px 22px;}
.btn.submit-btn:hover{background:#1e4530;}
.btn.submit-btn:disabled{background:#aaa;border-color:#aaa;cursor:not-allowed;}
.final-panel{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:1.5rem 1.8rem;margin-top:1.8rem;display:none;}
.final-score{font-family:'Playfair Display',Georgia,serif;font-size:2.8rem;color:var(--accent);margin-bottom:.2rem;line-height:1;}
.final-pct{font-size:13px;color:var(--muted);margin-bottom:1rem;}
.submit-status{font-size:12px;margin-top:.6rem;padding:.4rem .8rem;border-radius:5px;display:none;}
.submit-status.sending{display:block;background:#fffbe8;color:#806a00;border:1px solid #d0c060;}
.submit-status.success{display:block;background:var(--correct-bg);color:var(--green);border:1px solid var(--correct-border);}
.submit-status.error{display:block;background:var(--wrong-bg);color:var(--red);border:1px solid var(--wrong-border);}
.footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--rule);font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.5px;display:flex;justify-content:space-between;}
</style>
</head>

/* ── State ─────────────────────────────────────────────────── */
var S = { name:'', qs:[], sels:[], checkedCount:0, score:0 };

function startQuiz() {
  S.name = (document.getElementById('participant-name').value.trim()) || 'Anonym';

  // Shuffle options per question
  S.qs = QUESTIONS.map(function(q) {
    var n = q.opts.length, idx = [];
    for (var k=0;k<n;k++) idx.push(k);
    for (var j=n-1;j>0;j--) { var r=Math.floor(Math.random()*(j+1)),t=idx[j];idx[j]=idx[r];idx[r]=t; }
    return {
      set: q.set, q: q.q,
      opts: idx.map(function(i){return q.opts[i];}),
      correct: q.correct.map(function(c){return idx.indexOf(c);}),
      exp: q.exp, src: q.src, url: q.url
    };
  });
  S.sels = S.qs.map(function(){return [];});
  S.checkedCount = 0; S.score = 0;

  document.getElementById('setup-section').style.display = 'none';
  document.getElementById('quiz-section').style.display = 'block';
  renderQuestions();
}

function renderQuestions() {
  var container = document.getElementById('questions-container');
  container.innerHTML = '';
  var total = S.qs.length;

  S.qs.forEach(function(q, qi) {
    // Role separator
    if (qi === 5) {
      var sep = document.createElement('div');
      sep.className = 'role-label role-two';
      sep.textContent = 'Perspektive: ' + ROLE2;
      container.appendChild(sep);
    } else if (qi === 0) {
      var sep0 = document.createElement('div');
      sep0.className = 'role-label role-kib';
      sep0.textContent = 'Perspektive: KI-Beauftragte:r';
      container.appendChild(sep0);
    }

    var card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + qi;

    var numEl = document.createElement('div');
    numEl.className = 'q-num';
    numEl.textContent = 'Frage ' + (qi+1) + ' von ' + total;
    card.appendChild(numEl);

    var qEl = document.createElement('div');
    qEl.className = 'q-text';
    qEl.textContent = q.q;
    card.appendChild(qEl);

    var hint = document.createElement('div');
    hint.className = 'q-hint';
    hint.textContent = 'Eine oder mehrere Antworten können richtig sein.';
    card.appendChild(hint);

    var ul = document.createElement('ul');
    ul.className = 'opt-list';
    ul.id = 'opts-' + qi;

    q.opts.forEach(function(opt, oi) {
      var li = document.createElement('li');
      li.id = 'opt-' + qi + '-' + oi;
      li.onclick = (function(a,b){return function(){toggleOpt(a,b);};})(qi,oi);

      var box = document.createElement('span');
      box.className = 'opt-box';
      box.id = 'box-' + qi + '-' + oi;
      li.appendChild(box);

      var txt = document.createElement('span');
      txt.textContent = opt;
      li.appendChild(txt);

      ul.appendChild(li);
    });
    card.appendChild(ul);

    var expEl = document.createElement('div');
    expEl.className = 'exp';
    expEl.id = 'exp-' + qi;
    card.appendChild(expEl);

    var btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    var btn = document.createElement('button');
    btn.className = 'btn primary';
    btn.id = 'btn-check-' + qi;
    btn.textContent = 'Auswerten';
    btn.onclick = (function(a){return function(){checkQ(a);};})(qi);
    btnRow.appendChild(btn);
    card.appendChild(btnRow);

    container.appendChild(card);
  });
}

function toggleOpt(qi, oi) {
  var card = document.getElementById('card-' + qi);
  if (card.classList.contains('answered')) return;
  var sel = S.sels[qi];
  var pos = sel.indexOf(oi);
  if (pos >= 0) sel.splice(pos,1); else sel.push(oi);
  var li = document.getElementById('opt-' + qi + '-' + oi);
  var box = document.getElementById('box-' + qi + '-' + oi);
  if (sel.indexOf(oi) >= 0) {
    li.classList.add('selected');
    box.textContent = '✓';
  } else {
    li.classList.remove('selected');
    box.textContent = '';
  }
}

function checkQ(qi) {
  var card = document.getElementById('card-' + qi);
  if (card.classList.contains('answered')) return;
  card.classList.add('answered');

  var q = S.qs[qi];
  var sel = S.sels[qi];
  var selSorted = sel.slice().sort().join(',');
  var corSorted = q.correct.slice().sort().join(',');
  var isFullRight = selSorted === corSorted;
  if (isFullRight) S.score++;

  q.opts.forEach(function(opt, oi) {
    var li  = document.getElementById('opt-' + qi + '-' + oi);
    var box = document.getElementById('box-' + qi + '-' + oi);
    var isSel  = sel.indexOf(oi) >= 0;
    var isCorr = q.correct.indexOf(oi) >= 0;

    li.classList.remove('selected');
    li.classList.add('disabled');

    if (isSel && isCorr)  { li.classList.add('correct-sel'); box.textContent = '✓'; }
    else if (isSel)        { li.classList.add('wrong-sel');   box.textContent = '✗'; }
    else if (isCorr)       { li.classList.add('missed');      box.textContent = '→'; }
    else                   { box.textContent = ''; }
  });

  var expEl = document.getElementById('exp-' + qi);
  expEl.innerHTML = q.exp
    + '<div class="exp-src">Quelle: <a href="'+q.url+'" target="_blank">'+q.src+'</a></div>';
  expEl.classList.add('visible');

  var btn = document.getElementById('btn-check-' + qi);
  btn.disabled = true;
  btn.style.opacity = '.4';

  S.checkedCount++;
  if (S.checkedCount === S.qs.length) showFinalPanel();
}

function showFinalPanel() {
  var pct = Math.round(S.score / S.qs.length * 100);
  document.getElementById('final-score').textContent = S.score + ' / ' + S.qs.length;
  document.getElementById('final-pct').textContent = pct + ' % korrekt';
  var panel = document.getElementById('final-panel');
  panel.style.display = 'block';
  panel.scrollIntoView({behavior:'smooth', block:'start'});
}

function sendToSheets() {
  var btn = document.getElementById('btn-send');
  btn.disabled = true;
  var status = document.getElementById('submit-status');
  status.className = 'submit-status sending';
  status.textContent = 'Wird übermittelt…';

  var urls = [];
  S.qs.forEach(function(q, i) {
    var selSorted  = S.sels[i].slice().sort();
    var corSorted  = q.correct.slice().sort();
    var isOk       = selSorted.join(',') === corSorted.join(',');
    var gewaehlt   = selSorted.length ? selSorted.join(',') : '-';
    var korrekt    = corSorted.join(',');

    urls.push(APPS_SCRIPT_URL
      + '?tab='        + encodeURIComponent('KI-Beauftragter')
      + '&teilnehmer=' + encodeURIComponent(S.name)
      + '&tag='        + TAG_NR
      + '&thema='      + encodeURIComponent(THEMA)
      + '&stufe='      + encodeURIComponent(q.set)
      + '&frage_nr='   + (i+1)
      + '&frage_text=' + encodeURIComponent(q.q.substring(0,80))
      + '&gewaehlt='   + encodeURIComponent(gewaehlt)
      + '&korrekt='    + encodeURIComponent(korrekt)
      + '&ergebnis='   + encodeURIComponent(isOk ? 'RICHTIG' : 'FALSCH')
    );
  });

  var idx = 0;
  function next() {
    if (idx >= urls.length) {
      status.className = 'submit-status success';
      status.textContent = '✓ ' + urls.length + ' Antworten übermittelt (' + new Date().toLocaleTimeString('de-DE') + ')';
      return;
    }
    fetch(urls[idx], {mode:'no-cors'}).catch(function(){}).finally(function(){idx++;next();});
  }
  next();
}
</script>
